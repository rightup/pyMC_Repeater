services:
  openhop-repeater:
    image: openhop-repeater:local
    build:
      context: .
      dockerfile: dockerfile
      args:
        PUID: ${PUID:-15888}
        PGID: ${PGID:-15888}
        DIALOUT_GID: ${DIALOUT_GID:-20}
        GPIO_GID: ${GPIO_GID:-986}
        SPI_GID: ${SPI_GID:-989}
        YQ_VERSION: ${YQ_VERSION:-v4.40.5}
        YQ_SHA256_AMD64: ${YQ_SHA256_AMD64:-}
        YQ_SHA256_ARM64: ${YQ_SHA256_ARM64:-}
        YQ_SHA256_ARM: ${YQ_SHA256_ARM:-}
        PYMC_CONSOLE_VERSION: ${PYMC_CONSOLE_VERSION:-}
        PYMC_CONSOLE_SHA256_AMD64: ${PYMC_CONSOLE_SHA256_AMD64:-}
        PYMC_CONSOLE_SHA256_ARM64: ${PYMC_CONSOLE_SHA256_ARM64:-}
        PYMC_CONSOLE_SHA256_ARM: ${PYMC_CONSOLE_SHA256_ARM:-}
        PYMC_CONSOLE_ALLOW_LATEST: ${PYMC_CONSOLE_ALLOW_LATEST:-0}
        PYMC_CONSOLE_CACHE_BUST: ${PYMC_CONSOLE_CACHE_BUST:-default}
