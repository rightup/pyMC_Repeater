name: Publish Docker Image

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      image_repository:
        description: "Docker image repository to publish to"
        required: false
        default: ""
      pymc_console_version:
        description: "Exact PyMC Console tag to bundle (defaults to repository variable)"
        required: false
        default: ""
      pymc_console_sha256:
        description: "Verified SHA-256 for that Console archive (defaults to repository variable)"
        required: false
        default: ""

jobs:
  docker:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.repository == 'openhop-dev/openhop_repeater' ||
      github.repository_owner == 'yellowcooln'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute package version
        id: package_version
        run: |
          python -m pip install --disable-pip-version-check setuptools_scm
          version="$(python -m setuptools_scm)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Determine image repository
        id: image_repo
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REQUESTED_IMAGE_REPOSITORY: ${{ inputs.image_repository }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${REQUESTED_IMAGE_REPOSITORY}" ]; then
            image_repository="${REQUESTED_IMAGE_REPOSITORY}"
          elif [ "${REPOSITORY_OWNER}" = "yellowcooln" ]; then
            image_repository="yellowcooln/pymc-repeater"
          else
            image_repository="openhop/openhop-repeater"
          fi

          if [[ ! "${image_repository}" =~ ^[a-z0-9]([a-z0-9._-]{0,126}[a-z0-9])?/[a-z0-9]([a-z0-9._-]{0,126}[a-z0-9])?$ ]]; then
            echo "image_repository must be a lowercase Docker Hub owner/name pair." >&2
            exit 1
          fi

          echo "Using image repository: ${image_repository}"
          printf 'image_repository=%s\n' "${image_repository}" >> "$GITHUB_OUTPUT"

      - name: Validate verified artifact pins
        id: artifact_pins
        shell: bash
        env:
          REQUESTED_CONSOLE_VERSION: ${{ inputs.pymc_console_version }}
          REQUESTED_CONSOLE_SHA256: ${{ inputs.pymc_console_sha256 }}
          PINNED_CONSOLE_VERSION: ${{ vars.PYMC_CONSOLE_VERSION }}
          PINNED_CONSOLE_SHA256: ${{ vars.PYMC_CONSOLE_SHA256 }}
          PINNED_YQ_VERSION: ${{ vars.YQ_VERSION }}
          PINNED_YQ_SHA256_AMD64: ${{ vars.YQ_SHA256_AMD64 }}
          PINNED_YQ_SHA256_ARM64: ${{ vars.YQ_SHA256_ARM64 }}
        run: |
          set -euo pipefail

          if { [ -n "${REQUESTED_CONSOLE_VERSION}" ] && [ -z "${REQUESTED_CONSOLE_SHA256}" ]; } \
            || { [ -z "${REQUESTED_CONSOLE_VERSION}" ] && [ -n "${REQUESTED_CONSOLE_SHA256}" ]; }; then
            echo "Workflow overrides must provide both pymc_console_version and pymc_console_sha256." >&2
            exit 1
          fi
          if [ -n "${REQUESTED_CONSOLE_VERSION}" ]; then
            console_version="${REQUESTED_CONSOLE_VERSION}"
            console_sha256="${REQUESTED_CONSOLE_SHA256}"
          else
            console_version="${PINNED_CONSOLE_VERSION}"
            console_sha256="${PINNED_CONSOLE_SHA256}"
          fi
          yq_version="${PINNED_YQ_VERSION:-v4.40.5}"

          validate_sha256() {
            label="$1"
            value="$2"
            if [[ ! "${value}" =~ ^[0-9a-fA-F]{64}$ ]]; then
              echo "${label} must be a verified 64-character SHA-256." >&2
              exit 1
            fi
          }

          if [ -z "${console_version}" ] || [ "${console_version}" = "latest" ]; then
            echo "Set PYMC_CONSOLE_VERSION to an exact tag in repository variables or workflow input." >&2
            exit 1
          fi
          if [ "${yq_version}" = "latest" ]; then
            echo "YQ_VERSION must be an exact tag." >&2
            exit 1
          fi
          if [[ ! "${console_version}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "PYMC_CONSOLE_VERSION must contain only tag-safe characters." >&2
            exit 1
          fi
          if [[ ! "${yq_version}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "YQ_VERSION must contain only tag-safe characters." >&2
            exit 1
          fi

          validate_sha256 "PYMC_CONSOLE_SHA256" "${console_sha256}"
          validate_sha256 "YQ_SHA256_AMD64" "${PINNED_YQ_SHA256_AMD64}"
          validate_sha256 "YQ_SHA256_ARM64" "${PINNED_YQ_SHA256_ARM64}"

          echo "Bundling verified PyMC Console ${console_version}"
          {
            echo "console_version=${console_version}"
            echo "console_sha256=${console_sha256}"
            echo "console_cache_bust=${console_version}@${console_sha256}"
            echo "yq_version=${yq_version}"
            echo "yq_sha256_amd64=${PINNED_YQ_SHA256_AMD64}"
            echo "yq_sha256_arm64=${PINNED_YQ_SHA256_ARM64}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image_repo.outputs.image_repository }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PACKAGE_VERSION=${{ steps.package_version.outputs.version }}
            YQ_VERSION=${{ steps.artifact_pins.outputs.yq_version }}
            YQ_SHA256_AMD64=${{ steps.artifact_pins.outputs.yq_sha256_amd64 }}
            YQ_SHA256_ARM64=${{ steps.artifact_pins.outputs.yq_sha256_arm64 }}
            PYMC_CONSOLE_VERSION=${{ steps.artifact_pins.outputs.console_version }}
            PYMC_CONSOLE_SHA256_AMD64=${{ steps.artifact_pins.outputs.console_sha256 }}
            PYMC_CONSOLE_SHA256_ARM64=${{ steps.artifact_pins.outputs.console_sha256 }}
            PYMC_CONSOLE_ALLOW_LATEST=0
            PYMC_CONSOLE_CACHE_BUST=${{ steps.artifact_pins.outputs.console_cache_bust }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify Home Assistant add-on repository
        if: github.repository == 'openhop-dev/openhop_repeater'
        env:
          DISPATCH_TOKEN: ${{ secrets.HA_ADDON_REPO_DISPATCH_TOKEN }}
          CHANNEL: ${{ github.ref_name }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${DISPATCH_TOKEN}" ]; then
            echo "HA_ADDON_REPO_DISPATCH_TOKEN is not set" >&2
            exit 1
          fi

          payload="$(
            jq -cn \
              --arg channel "${CHANNEL}" \
              --arg revision "${REVISION}" \
              '{
                event_type: "sync-upstream-channel",
                client_payload: {
                  channel: $channel,
                  revision: $revision
                }
              }'
          )"

          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            https://api.github.com/repos/openhop-dev/openHop-HA-Add-on/dispatches \
            --data-binary "${payload}"
