          description: Discovery session started
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      session_id:
                        type: string
                      tag:
                        type: integer
                      status:
                        type: string
                      timeout:
                        type: number
                      filter_mask:
                        type: integer
                      since:
                        type: integer
                      prefix_only:
                        type: boolean
                      created_at:
                        type: number
                      started_at:
                        type: number
                        nullable: true
                      completed_at:
                        type: number
                        nullable: true
                      count:
                        type: integer
                      error:
                        type: string
                        nullable: true
                  message:
                    type: string
                  error:
                    type: string

