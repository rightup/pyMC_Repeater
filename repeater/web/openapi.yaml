  # ============================================================================
  # Charts & RRD Endpoints
  # ============================================================================
  /rrd_data:
    get:
      tags: [Charts]
      summary: Get RRD time-series data
      description: |
        Retrieve Round-Robin Database metrics for graphing.

        **Note:** This endpoint extracts parameters from the request internally.
        Parameters are handled automatically by the backend.
      responses:
        '200':
          description: RRD time-series data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      start_time:
                        type: integer
                      end_time:
                        type: integer
                      step:
                        type: integer
                      timestamps:
                        type: array
                        items:
                          type: integer
                      metrics:
                        type: object

  /packet_type_graph_data:
    get:
      tags: [Charts]
      summary: Get packet type distribution graph data
      description: Returns bar chart data showing packet counts by type
      parameters:
        - name: hours
          in: query
          schema:
            type: integer
            default: 24
          description: Time range in hours
        - name: resolution
          in: query
          schema:
            type: string
            enum: [average, max, min]
            default: average
        - name: types
          in: query
          schema:
            type: string
            default: all
          description: Comma-separated packet types or 'all'
      responses:
        '200':
          description: Packet type graph data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      start_time:
                        type: integer
                      end_time:
                        type: integer
                      step:
                        type: integer
                      chart_type:
                        type: string
                        example: bar
                      series:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            type:
                              type: string
                            data:
                              type: array
                              items:
                                type: number

  /metrics_graph_data:
    get:
      tags: [Charts]
      summary: Get system metrics graph data
      description: |
        Returns time-series data for system metrics like packet counts, RSSI, SNR, etc.

        Available metrics:
        - rx_count: Received packets
        - tx_count: Transmitted packets
        - drop_count: Dropped packets
        - avg_rssi: Average RSSI (dBm)
        - avg_snr: Average SNR (dB)
        - avg_length: Average packet length
        - avg_score: Average score
        - neighbor_count: Neighbor count
      parameters:
        - name: hours
          in: query
          schema:
            type: integer
            default: 24
          description: Time range in hours
        - name: resolution
          in: query
          schema:
            type: string
            enum: [average, max, min]
            default: average
        - name: metrics
          in: query
          schema:
            type: string
            default: all
          description: Comma-separated metric names or 'all'
          example: "rx_count,tx_count,avg_rssi"
      responses:
        '200':
          description: Metrics graph data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      start_time:
                        type: integer
                      end_time:
                        type: integer
                      step:
                        type: integer
                      timestamps:
                        type: array
                        items:
                          type: integer
                      series:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            type:
                              type: string
                            data:
                              type: array
                              items:
                                type: number

  /lbt_diagnostics:
    get:
      tags: [Charts]
      summary: Get LBT diagnostics aligned with RF metrics
      description: |
        Returns aggregated Listen Before Talk (LBT) diagnostics for transmission-path
        packets, aligned to RF health buckets for correlation analysis.

        Notes:
        - LBT total attempts are derived as `lbt_attempts + 1` from stored packet metadata.
        - Buckets are bounded and aggregated server-side for efficient dashboard refresh.
      parameters:
        - name: hours
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 168
            default: 24
          description: Fallback range in hours when explicit timestamps are not provided.
        - name: start_timestamp
          in: query
          schema:
            type: number
            format: float
          description: Inclusive start timestamp (Unix epoch seconds).
        - name: end_timestamp
          in: query
          schema:
            type: number
            format: float
          description: Inclusive end timestamp (Unix epoch seconds).
        - name: bucket_seconds
          in: query
          schema:
            type: integer
            minimum: 60
            maximum: 3600
          description: Bucket width in seconds. If omitted, server auto-selects based on range.
        - name: severe_attempt_threshold
          in: query
          schema:
            type: integer
            minimum: 2
            maximum: 16
            default: 4
          description: Attempt threshold used to classify severe contention events.
      responses:
        '200':
          description: LBT diagnostics response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/LbtDiagnosticsResponse'

  /noise_floor_history:
    get:
      tags: [Noise Floor]
      summary: Get noise floor history
      description: Retrieve historical noise floor measurements
      parameters:
        - name: hours
          in: query
          schema:
            type: integer
            default: 24
            minimum: 1
            maximum: 168
          description: Time range in hours
      responses:
        '200':
          description: Noise floor history
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object

  /noise_floor_stats:
    get:
      tags: [Noise Floor]
      summary: Get noise floor statistics
      description: Statistical analysis of noise floor measurements
      parameters:
        - name: hours
          in: query
          schema:
            type: integer
            default: 24
          description: Time range in hours
      responses:
        '200':
          description: Noise floor statistics
