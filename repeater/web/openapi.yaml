  # ============================================================================
  # Mobile Companion API v1 (repeater/web/mobile_endpoints.py)
  # ============================================================================
  /v1/server_info:
    get:
      tags: [Mobile Companion API v1]
      summary: Unauthenticated discovery
      description: |
        Unauthenticated-safe minimum an app uses to validate a scanned
        pairing URL before it has any credential: site name, supported API
        version(s), supported auth modes, repeater version/time.
        Deliberately excludes companion names (`GET /v1/companions` requires
        auth).
      responses:
        '200':
          description: Server info
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [site_name, api_versions, auth_modes, transport, server]
                        properties:
                          site_name:
                            type: string
                          api_versions:
                            type: array
                            items:
                              type: string
                            example: ["v1"]
                          auth_modes:
                            type: array
                            items:
                              type: string
                            example: ["jwt", "api_token"]
                          transport:
                            type: object
                            required: [scheme, secure, trusted_network_required]
                            properties:
                              scheme:
                                type: string
                                enum: [http, https]
                              secure:
                                type: boolean
                              trusted_network_required:
                                type: boolean
                                description: True for plaintext HTTP.
                          server:
                            type: object
                            required: [version, time]
                            properties:
                              version:
                                type: string
                                nullable: true
                              time:
                                type: number
              examples:
                success:
                  value:
                    success: true
                    data:
                      site_name: "Everett North Repeater"
                      api_versions: ["v1"]
                      auth_modes: ["jwt", "api_token"]
                      transport:
                        scheme: https
                        secure: true
                        trusted_network_required: false
                      server: { version: "1.4.0", time: 1789012345.6 }
        '405':
          description: |
            Method not allowed (only `GET`/`OPTIONS`). `Allow: GET` header
            set; rendered as the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'

  /v1/pair/start:
    post:
      tags: [Mobile Companion API v1]
      summary: Generate a pairing code (admin)
      description: |
        Admin-scope-only. Generates a single-use, 5-minute-TTL pairing code
        for a companion identity (architecture §9, pairing step 1). Exempt from the
        tree-wide `/api` auth gate by config path (it shares the `/api/v1/
        pair` exemption via CherryPy config-path cascade), so this handler
        re-checks `admin` scope itself.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companion_name]
              additionalProperties: false
              properties:
                companion_name:
                  $ref: '#/components/schemas/CompanionRegistrationName'
      responses:
        '200':
          description: Pairing code generated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [code, expires_in, companion_name, companion_identity, fingerprint]
                        properties:
                          code:
                            type: string
                            description: 128-bit hex pairing code (5-minute TTL).
                          expires_in:
                            type: integer
                            example: 300
                          companion_name:
                            $ref: '#/components/schemas/CompanionRegistrationName'
                          companion_identity:
                            type: string
                            pattern: '^[0-9a-f]{64}$'
                            description: Immutable 32-byte companion public key, lowercase hex.
                          fingerprint:
                            type: string
                            pattern: '^[0-9a-f]{64}$'
                            description: |
                              Lowercase SHA-256 hex of `companion_identity`.
                              Transfer this through the trusted pairing channel
                              and compare it with `/pair`. It detects an
                              unexpected identity; it does not authenticate a
                              plaintext HTTP server.
        '400':
          description: |
            `companion_name required`. Rendered as the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '401':
          description: Missing/invalid JWT or API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '403':
          description: |
            `Admin scope required`. Rendered as the v1 JSON error envelope (see tag
            description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '404':
          description: |
            `Companion '{companion_name}' not found`. Rendered as the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '415':
          description: Request body must use the application/json media type.
        '503':
          $ref: '#/components/responses/ServiceUnavailableV1'

  /v1/pair:
    post:
      tags: [Mobile Companion API v1]
      summary: Exchange a pairing code for a device token
      description: |
        No auth — the pairing code itself is the credential (architecture §9,
        steps 2-3). Exempt from the tree-wide `/api` auth gate. The
        code is consumed atomically (single use); unknown and expired codes
        both 404 with the same message so a caller can't distinguish "wrong
        code" from "code expired". Attempts are rate-limited per remote
        address before code lookup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, device_id, name]
              additionalProperties: false
              properties:
                code:
                  type: string
                  minLength: 32
                  maxLength: 32
                  pattern: '^[0-9a-fA-F]{32}$'
                  description: Single-use 128-bit pairing code, hex encoded.
                device_id:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: |
                    Client-generated stable device identifier, globally unique
                    on this repeater; maximum 128 UTF-8 bytes. Leading/trailing
                    whitespace, ASCII controls, `/`, `\`, `.` and `..` are
                    rejected rather than normalized.
                name:
                  type: string
                  minLength: 1
                  maxLength: 96
                  description: |
                    Human-readable device name, trimmed and limited to 96
                    UTF-8 bytes (for example, "Adam's iPhone").
                platform:
                  type: string
                  nullable: true
                  maxLength: 32
                  description: Optional platform label, trimmed; maximum 32 UTF-8 bytes.
                  example: ios
      responses:
        '200':
          description: Device paired; token returned once.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [token, device_id, companion_name, companion_identity, fingerprint, scope]
                        properties:
                          token:
                            type: string
                            description: |
                              Plaintext device API token — shown once, store in
                              Keychain. Send on subsequent v1 requests as
                              `Authorization: Bearer <token>` or
                              `X-API-Key: <token>`.
                          device_id:
                            type: string
                          companion_name:
                            $ref: '#/components/schemas/CompanionRegistrationName'
                          companion_identity:
                            type: string
                            pattern: '^[0-9a-f]{64}$'
                            description: Immutable 32-byte companion public key, lowercase hex.
                          fingerprint:
                            type: string
                            pattern: '^[0-9a-f]{64}$'
                            description: |
                              Lowercase SHA-256 hex of `companion_identity`;
                              compare with the value received through the
                              trusted pairing channel before storing the token.
                          scope:
                            type: string
                            example: "companion:field-radio-1"
        '400':
          description: |
            `code, device_id, and name are required`. Rendered as the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '404':
          description: |
            `Invalid or expired pairing code`. Rendered as the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '409':
          description: |
            `device_id already registered`. Device and token creation is one
            transaction, so no token survives this conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '415':
          description: Request body must use the application/json media type.
        '429':
          description: |
            `Too many pairing attempts, try again later`. Includes
            `Retry-After`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '500':
          description: |
            `Authentication not configured` (no token manager wired up).
            Rendered as the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '503':
          description: Pairing storage is unavailable. A still-live code remains reusable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'

  /v1/devices:
    get:
      tags: [Mobile Companion API v1]
      summary: List paired devices (admin)
      description: |
        All companions' paired devices. `last_seen` is backfilled from the
        linked api_token's `last_used` timestamp when that is newer than the
        device row's own `last_seen` — presence is derived from token use,
        not written per-request. Token ids, push tokens, relay configuration,
        and mention keywords are intentionally redacted.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Paired devices
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          required:
                            - device_id
                            - name
                            - platform
                            - companion_hash
                            - companion_identity
                            - created_at
                            - last_seen
                            - push_registered
                            - push_detail
                            - mention_push
                          properties:
                            companion_hash:
                              type: string
                              pattern: '^0x[0-9a-f]{2}$'
                            companion_identity:
                              type: string
                              nullable: true
                              description: Full immutable companion public key, lowercase hex.
                            device_id:
                              type: string
                            name:
                              type: string
                            platform:
                              type: string
                              nullable: true
                            push_registered:
                              type: boolean
                            push_detail:
                              type: string
                              enum: [none, count, preview]
                              description: Per-device push content level (architecture §11). Defaults to `none`.
                            mention_push:
                              type: boolean
                              description: Whether the content-free mention alert class is enabled for this device (architecture §11).
                            created_at:
                              type: number
                            last_seen:
                              type: number
                              nullable: true
        '403':
          description: |
            `Admin scope required`. Rendered as the v1 JSON error envelope (see tag
            description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '503':
          $ref: '#/components/responses/ServiceUnavailableV1'

  /v1/devices/{device_id}:
    delete:
      tags: [Mobile Companion API v1]
      summary: Revoke a paired device
      description: |
        Deletes the device's `api_tokens` row (its next request 401s
        naturally) and its `companion_devices` row. A paired device token may
        revoke its own `device_id`; an admin may revoke any device. A device
        probing another id receives the same `404` as an unknown id.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
          description: |
            Stable device identifier; maximum 128 UTF-8 bytes. No edge
            whitespace, ASCII controls, slash/backslash, `.` or `..`.
      responses:
        '200':
          description: Device revoked
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [revoked, device_id]
                        properties:
                          revoked:
                            type: boolean
                            example: true
                          device_id:
                            type: string
        '401':
          description: Missing/invalid JWT or API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '404':
          description: |
            `Device '{device_id}' not found`. Rendered as the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '503':
          $ref: '#/components/responses/ServiceUnavailableV1'

  /v1/devices/{device_id}/push:
    post:
      tags: [Mobile Companion API v1]
      summary: Register a device's push credentials
      description: |
        Register (or refresh) an APNs/FCM token and content preference for a
        paired device. When `companion.push.relay_url` is configured, the
        repeater POSTs message wakes to that single operator-owned endpoint.
        Devices cannot select a URL.

        **Payload-free by default.** `push_detail: none` sends only a wake;
        `count` adds a `badge_hint`; `preview` adds a short `alert` string —
        opting `preview` in is the only way message text reaches the relay,
        which is why it defaults off (architecture §11).

        **Mentions.** `mention_push: true` enables a separate, content-free
        mention alert: when a new message's text matches one of the device's
        `mention_keywords` (or, if none set, the companion's node_name — as a
        whole word, case-insensitive), the relay push is a user-visible alert
        (`{mention: true, alert: "You were mentioned"}`, never the message
        text) instead of a silent wake. It takes precedence over `push_detail`
        for that push and is what makes a mention prompt without leaking
        content (architecture §11).

        Registration still succeeds when no relay is configured; in that
        case the notifier is inactive and the app uses sync/SSE.

        Only inbound durable message events produce wakes. Outbound sends
        from REST or the parallel frame client do not trigger push.

        Auth: the device's **own** token (the token paired to `device_id`), or
        `admin`. A scoped device token registering for a *different* device
        gets `404` (same not-found-folding as the rest of /api/v1 — no
        cross-device existence leak). Optional preference fields retain their
        stored values when omitted.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
          description: |
            Stable device identifier; maximum 128 UTF-8 bytes. No edge
            whitespace, ASCII controls, slash/backslash, `.` or `..`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [push_token]
              additionalProperties: false
              properties:
                push_token:
                  type: string
                  minLength: 1
                  maxLength: 4096
                  description: |
                    APNs/FCM device token; maximum 4096 UTF-8 bytes. Leading/
                    trailing whitespace and ASCII controls are rejected.
                push_detail:
                  type: string
                  enum: [none, count, preview]
                  description: Content level. Omitted → stored value (default `none`).
                mention_push:
                  type: boolean
                  description: Enable the content-free mention alert class. Omitted → stored value (default false).
                mention_keywords:
                  type: array
                  maxItems: 32
                  items:
                    type: string
                    maxLength: 64
                    description: Maximum 64 UTF-8 bytes; blank values are discarded.
                  description: |
                    Trigger strings for mentions. Omitted → stored value;
                    `[]` → fall back to the companion node_name. At most 32;
                    trimmed duplicates collapse to one stored value.
      responses:
        '200':
          description: Push registered
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [device_id, push_detail, mention_push, registered]
                        properties:
                          device_id:
                            type: string
                          push_detail:
                            type: string
                            enum: [none, count, preview]
                          mention_push:
                            type: boolean
                          registered:
                            type: boolean
                            example: true
        '400':
          description: |
            Missing/oversized `push_token`, invalid `push_detail`, non-boolean
            `mention_push`, invalid/oversized `mention_keywords`, or any
            unknown field (including `push_relay_url`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '401':
          description: Missing/invalid JWT or API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '404':
          description: |
            Device not found — also returned when a non-admin token that
            isn't this device's own attempts the call (no cross-device
            existence leak). Rendered as the v1 JSON error envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeV1'
        '503':
          $ref: '#/components/responses/ServiceUnavailableV1'
    delete:
      tags: [Mobile Companion API v1]
      summary: Clear a device's push registration
      description: |
        Nulls the device's `push_token` (a complete push opt-out — the
        notifier skips any device without a token). Preferences remain, so a
        later re-register need only supply a fresh token. Same auth as POST.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
          description: |
            Stable device identifier; maximum 128 UTF-8 bytes. No edge
            whitespace, ASCII controls, slash/backslash, `.` or `..`.
      responses:
        '200':
          description: Push unregistered
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [unregistered, device_id]
                        properties:
                          unregistered:
                            type: boolean
                            example: true
                          device_id:
                            type: string
        '401':
          description: Missing/invalid JWT or API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '404':
          description: |
            Device not found (or not the caller's own device). Rendered as the
            v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '503':
          $ref: '#/components/responses/ServiceUnavailableV1'

  /v1/companions:
    get:
      tags: [Mobile Companion API v1]
      summary: List companion identities
      description: |
        Scope-filtered (architecture §9): a `companion:{name}` device token
        sees only its own companion (name + public key of the others are
        withheld, not just their action endpoints); `admin`/`companion:*`
        callers see all. Authentication always supplies an explicit normalized
        scope; an incomplete auth context fails closed.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Companion identities visible to this caller's scope
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/MobileCompanionSummary'
        '401':
          description: Missing/invalid JWT or API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '503':
          $ref: '#/components/responses/ServiceUnavailableV1'

  /v1/companions/{name}/snapshot:
    get:
      tags: [Mobile Companion API v1]
      summary: Bootstrap document (state + journal cursor)
      description: |
        Full state snapshot plus the journal cursor it corresponds to
        (architecture §4.2): self info, contacts, channels (no PSK secrets),
        and the most recent messages. Journal head is read *before* the
        state queries, so any event with `seq >` the returned `cursor` may
        duplicate snapshot content — clients dedupe by message id.

        Supports conditional requests. The opaque `ETag` includes companion,
        journal epoch/head, and `messages_limit`; send it back as
        `If-None-Match` to get `304 Not Modified` when that exact snapshot
        request is unchanged.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/CompanionRegistrationName'
          description: Companion registration slug.
        - name: messages_limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 200
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
          description: Previously-received `ETag` value; a match returns `304`.
      responses:
        '200':
          description: Snapshot
          headers:
            ETag:
              schema:
                type: string
              description: Opaque validator for this companion and `messages_limit`.
            Cache-Control:
              schema:
                type: string
                example: private, no-store, no-cache, no-transform
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MobileSnapshot'
        '304':
          description: Not modified — `If-None-Match` matched the current `ETag`. No body.
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                example: private, no-store, no-cache, no-transform
        '401':
          description: Missing/invalid JWT or API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '404':
          description: |
            `Companion '{name}' not found` — returned both for unknown names
            and for companions outside the caller's token scope (identical
            status and message, so a scoped device token cannot enumerate
            other companion names). Rendered as the v1 JSON error envelope
            (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '503':
          $ref: '#/components/responses/ServiceUnavailableV1'

  /v1/companions/{name}/sync:
    get:
      tags: [Mobile Companion API v1]
      summary: Journal delta since a cursor
      description: |
        One indexed range scan (`idx_companion_events_sync`) bounded by
        `limit`. Cursors use the human-readable opaque form `epoch:seq`.
        A legacy bare sequence, an epoch mismatch, a future sequence, or a
        sequence below the companion's prune floor returns `200` with empty
        `events`, `"snapshot_required": true`, and a stable `reset_reason`.
        Re-fetch `snapshot` and resume from its `cursor`. `has_more: true`
        means immediately re-request with `next_cursor`.

        This endpoint intentionally has no `ETag`: the cursor already
        expresses the caller's position and every page is one coherent
        validate-and-read transaction.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/CompanionRegistrationName'
        - name: cursor
          in: query
          required: true
          schema:
            oneOf:
              - type: string
                maxLength: 128
                pattern: '^[0-9a-f]+:[0-9]+$'
                description: Opaque `epoch:seq` returned by this API.
              - type: string
                maxLength: 128
                pattern: '^[0-9]+$'
                description: |
                  Legacy bare sequence accepted only as a compatibility reset
                  input; the response requires a fresh snapshot.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 500
        - name: include
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
            pattern: '^rf_receptions(?:\s*,\s*rf_receptions)*$'
          description: |
            Comma-separated opt-in list of otherwise-excluded event types.
            The only recognized token is `rf_receptions` — without it, the
            `rf_reception` firehose events (architecture §6, off by default) are filtered
            out of `events` even for a companion that has the
            `rf_reception_events` setting enabled. Filtered rows still advance
            `next_cursor`/`has_more` (the scan, not the returned list, drives
            paging). Late opt-in is therefore prospective from the supplied
            cursor; use an older still-retained cursor to replay earlier RF
            rows. Empty and unknown tokens return `400`; repeating the known
            token is harmless.
      responses:
        '200':
          description: Delta (possibly empty)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: '#/components/schemas/MobileSyncDelta'
                          - $ref: '#/components/schemas/MobileSyncReset'
              examples:
                delta:
                  value:
                    success: true
                    data:
                      journal_epoch: "b3f1c2d4e5f60708"
                      events:
                        - { seq: 184224, type: message, ts: 1789012345.0, packet_hash: null, data: {} }
                      next_cursor: "b3f1c2d4e5f60708:184224"
                      has_more: false
                      snapshot_required: false
        '400':
          description: |
            `cursor required` or `Invalid cursor`. Rendered as the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '401':
          description: Missing/invalid JWT or API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '404':
          description: |
            Companion not found — also returned for companions outside the
            caller's token scope (identical status and message, so a scoped
            device token cannot enumerate other companion names). Rendered as
            the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '503':
          $ref: '#/components/responses/ServiceUnavailableV1'

  /v1/companions/{name}/messages:
    get:
      tags: [Mobile Companion API v1]
      summary: Paged message history (infinite scroll)
      description: |
        Newest-first page over `companion_messages`, independent of the
        journal — serves history/infinite-scroll rather than sync.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/CompanionRegistrationName'
        - name: before_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 9223372036854775807
          description: Exclusive upper bound on message `id` (rowid) — page backward in time.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Message page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [messages, next_before_id]
                        properties:
                          messages:
                            type: array
                            items:
                              $ref: '#/components/schemas/MobileMessage'
                          next_before_id:
                            type: integer
                            format: int64
                            minimum: 1
                            maximum: 9223372036854775807
                            nullable: true
                            description: Pass as `before_id` to fetch the next (older) page; `null` when this page was empty.
        '400':
          description: |
            `Invalid before_id`. Rendered as the v1 JSON error envelope (see tag
            description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '401':
          description: Missing/invalid JWT or API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '404':
          description: |
            Companion not found — also returned for companions outside the
            caller's token scope (identical status and message, so a scoped
            device token cannot enumerate other companion names). Rendered as
            the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '503':
          $ref: '#/components/responses/ServiceUnavailableV1'

    post:
      tags: [Mobile Companion API v1]
      summary: Send a DM or channel message
      description: |
        Sends RF, so `Idempotency-Key` is required and durably reserved before
        message persistence or radio work. The same principal, key, companion
        identity, and body replay the recorded result without transmitting
        again. Reusing the key for another request returns `409`.
        A paired-device principal is its full companion identity plus stable
        `device_id`, not its token or database row. Token rotation/re-pairing
        therefore cannot make an unresolved key dispatch again; do not switch
        device IDs to bypass an unknown result.

        Every accepted attempt first creates one outbound history row and
        returns its `message_id`. Its initial journal event has `state:
        pending`; later `message_send_state` events make `transmitted`,
        `confirmed`, `heard_repeated`, `failed`, or `indeterminate`
        observable to every client. `packet_hash` is included when the radio
        backend provides it.

        If HTTP fails after RF may have started, retry only with the same key.
        An `indeterminate` result explicitly means a new key could duplicate
        an over-the-air send. If storage is temporarily unavailable during
        that transition, the running server still remembers the key as
        indeterminate, blocks redispatch, and repairs durable state on a
        later same-key request; startup recovery covers a server restart.

        Completed/failed replay records are retained for at least 48 hours
        from first reservation (maintenance may retain them longer). Reconcile
        a lost result within that window. After it, inspect durable history
        and require an explicit decision; do not assume the old key still
        suppresses RF. Indeterminate records are retained rather than made
        reusable.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/CompanionRegistrationName'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[!-~]+$'
          description: |
            Non-blank caller-generated opaque retry key, scoped to the
            authenticated principal. Use 1–128 visible ASCII characters
            (`!` through `~`) with no whitespace; UUIDs are recommended.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              additionalProperties: false
              description: Exactly one of `to` or `channel_idx` is required (validated as a strict XOR).
              properties:
                to:
                  type: string
                  pattern: '^[0-9a-fA-F]{64}$'
                  description: Recipient's 32-byte public key, hex-encoded. Required for a DM; omit for a channel send.
                channel_idx:
                  type: integer
                  minimum: 0
                  description: Channel index (0 is valid). Required for a channel send; omit for a DM.
                text:
                  type: string
                  minLength: 1
                  maxLength: 160
                  description: |
                    Maximum 160 UTF-8 bytes. For a channel send, the
                    companion's `node_name + ": "` prefix also occupies that
                    wire budget, so the accepted text limit may be smaller.
                    NUL is rejected because MeshCore text payloads are
                    NUL-terminated.
                txt_type:
                  type: integer
                  enum: [0]
                  default: 0
                  description: DM only. Supplying it for a channel send is invalid.
      responses:
        '200':
          description: |
            Send attempted (`sent: false` is still a `200` — the radio/queue
            rejected it — not an error status), or a replayed response for a
            reused `Idempotency-Key` with an identical body. A safe
            pre-dispatch failure is also terminal and replayable without RF.
            Every `failed` result includes a human-readable `reason`.
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                enum: ["true"]
              description: Present only when this is a stored replay.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [message_id, sent, state]
                        properties:
                          message_id:
                            type: integer
                            minimum: 1
                            maximum: 9223372036854775807
                          sent:
                            type: boolean
                          state:
                            type: string
                            enum: [transmitted, failed]
                          reason:
                            type: string
                            minLength: 1
                            description: Present when `state` is `failed`.
                          packet_hash:
                            type: string
                            nullable: true
                            pattern: '^[0-9A-F]{16}$'
                          is_flood:
                            type: boolean
                            description: Direct messages only.
                          expected_ack:
                            type: integer
                            nullable: true
                            minimum: 0
                            maximum: 4294967295
                            description: Direct-message ACK correlation value.
              examples:
                dm_sent:
                  value:
                    success: true
                    data:
                      message_id: 42
                      sent: true
                      state: transmitted
                      packet_hash: AABBCCDDEEFF0011
                      is_flood: false
                      expected_ack: 305419896
                channel_sent:
                  value:
                    success: true
                    data:
                      message_id: 43
                      sent: true
                      state: transmitted
                      packet_hash: 1122334455667788
        '400':
          description: |
            Missing/oversized `Idempotency-Key`, invalid or oversized JSON,
            unknown fields, neither/both targets, invalid target/index/text,
            or `txt_type` on a channel send.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '401':
          description: Missing/invalid JWT or API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '404':
          description: |
            Companion not found — also returned for companions outside the
            caller's token scope (identical status and message, so a scoped
            device token cannot enumerate other companion names). Rendered as
            the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '409':
          description: |
            The key conflicts with another request, the original send is
            still in progress (`Retry-After: 1`), or its outcome is
            indeterminate. Indeterminate responses include known
            `message_id`, `packet_hash`, and `expected_ack`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '429':
          description: RF admission limit exceeded. Includes `Retry-After`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeV1'
        '503':
          description: |
            Durable storage is unavailable before RF, or RF may have happened
            but its final state could not be persisted. The latter response
            carries `state: indeterminate`; retry only with the same key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'

  /v1/companions/{name}/events:
    get:
      tags: [Mobile Companion API v1]
      summary: Resumable live event stream (SSE)
      description: |
        `text/event-stream`. Each frame uses `id: epoch:seq`, `event:` equal
        to the journal event type, and `data:` equal to the same JSON object
        returned by `sync`.

        **Resume point:** the standard `Last-Event-ID` header if present,
        else `?cursor=`, else the current journal head (a bare connection
        gets a live tail only, no replay). On connect the server drains the
        backlog from that point (paged, reusing the sync query) before
        switching to a live tail. Any reset-invalid cursor (missing/mismatched
        epoch, future seq, or pruned seq) gets one
        `event: snapshot_required` frame and closes.

        Keepalive: a `: ka` comment frame every `http.sse_keepalive_sec`
        (default 15s) while idle. Listener notifications are a coalescing wake
        signal only; the stream always reads ordered rows from SQLite, so a
        burst cannot reorder or drop journal events.

        One stream is allowed per authenticated principal and companion. This
        route and legacy `/companion/events` share one process-wide default
        cap of 8 (`mobile_api.sse_max_connections`, maximum 256); it must
        leave two HTTP workers for ordinary APIs. Queue size is clamped to
        32..4096 and keepalive to 5..60 seconds.
        Use `Authorization` from a streaming client. `?token=` accepts only a
        short-lived operator JWT for browser `EventSource`, never a device
        token. The stream closes at JWT expiry. API tokens are revalidated at
        most every 15 seconds, including exact paired-device/full-identity
        ownership; revocation, scope/binding change, or authorization-storage
        uncertainty closes the connection. Resume with a current credential
        and the last durably applied cursor.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/CompanionRegistrationName'
        - name: cursor
          in: query
          required: false
          schema:
            oneOf:
              - type: string
                maxLength: 128
                pattern: '^[0-9a-f]+:[0-9]+$'
              - type: string
                maxLength: 128
                pattern: '^[0-9]+$'
                description: Legacy reset input; never emitted.
          description: "`epoch:seq` resume point if `Last-Event-ID` is absent. Defaults to current journal head."
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            oneOf:
              - type: string
                maxLength: 128
                pattern: '^[0-9a-f]+:[0-9]+$'
              - type: string
                maxLength: 128
                pattern: '^[0-9]+$'
                description: Legacy reset input; never emitted.
          description: Standard SSE resume header; takes priority over `?cursor=`.
        - name: token
          in: query
          required: false
          schema:
            type: string
          description: Operator JWT only, for `EventSource`. Prefer `Authorization`; never put a device token in a URL.
        - name: include
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
            pattern: '^rf_receptions(?:\s*,\s*rf_receptions)*$'
          description: |
            Same semantics as on `sync`: a comma-separated opt-in list whose
            only recognized token is `rf_receptions`. Applies to both the
            backlog replay and the live tail — without it, `rf_reception`
            firehose frames are suppressed. Empty and unknown tokens return
            `400`; repeating the known token is harmless.
      responses:
        '200':
          description: Event stream established
          headers:
            Content-Type:
              schema:
                type: string
                example: text/event-stream
            Cache-Control:
              schema:
                type: string
                example: no-store, no-cache, no-transform
            X-Accel-Buffering:
              schema:
                type: string
                example: "no"
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Stream of `id: {epoch}:{seq}\nevent: {type}\ndata: {json}\n\n` frames,
                  `: ka\n\n` keepalive comments, and — only when `cursor`/
                  `Last-Event-ID` requires reset — a single
                  `event: snapshot_required\ndata: {"journal_epoch":…,
                  "cursor":…,"snapshot_required":true,
                  "reset_reason":…}\n\n` frame before the stream ends.
        '400':
          description: |
            `Invalid cursor`. Rendered as the v1 JSON error envelope (see tag
            description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '401':
          description: Missing/invalid JWT or API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '404':
          description: |
            Companion not found — also returned for companions outside the
            caller's token scope (identical status and message, so a scoped
            device token cannot enumerate other companion names). Rendered as
            the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '429':
          description: |
            The principal already has this companion stream, or the global
            stream cap is full. Includes `Retry-After: 5`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '503':
          description: |
            `Companion event journal not available`. Rendered as the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'

  /v1/companions/{name}/contacts/{pubkey}:
    post:
      tags: [Mobile Companion API v1]
      summary: Add or update a contact
      description: |
        Upsert the contact identified by `{pubkey}`. The body carries only
        mutable fields. `name` is required on an insert, where `adv_type`
        defaults to the chat type (`1`). Omitted fields keep their current
        value on an update. Learned routing state (`out_path`,
        advert timestamps) is preserved across an update — a client renaming a
        contact must not erase what the mesh taught the node.

        Adverts already auto-add contacts (gated by `autoadd_config` and
        `autoadd_max_hops`, neither settable on this surface), so this is
        mainly for contacts auto-add filtered out: wrong type, or too many hops
        away.

        Emits a `contact` journal event (`change: new` or `update`).
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/CompanionRegistrationName'
        - name: pubkey
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{64}$'
          description: Contact's 32-byte public key, hex encoded.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 32
                  description: |
                    Contact name; maximum 32 UTF-8 bytes. Required when the
                    public key is not already a contact.
                adv_type:
                  type: integer
                  minimum: 1
                  maximum: 255
                  default: 1
                  description: |
                    Contact advert type. Core reserves `0` for the transient
                    non-contact type, so writable values are `1..255`.
                    Defaults to chat (`1`) on insert; unchanged on update.
                favorite:
                  type: boolean
                  description: |
                    Convenience over `flags` bit 0. Derived on read, and on
                    write sets/clears just that bit while preserving every
                    server-managed flag.
                gps_lat:
                  type: number
                  minimum: -90
                  maximum: 90
                gps_lon:
                  type: number
                  minimum: -180
                  maximum: 180
      responses:
        '200':
          description: Contact upserted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [contact]
                        properties:
                          contact:
                            $ref: '#/components/schemas/MobileContact'
        '400':
          description: |
            New contact without `name`, invalid field value, malformed JSON,
            or unknown field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '401':
          description: Missing/invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '404':
          description: Companion not found or out of scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '507':
          description: |
            Contact store is full — the equivalent of the frame protocol's
            `PUSH_CODE_CONTACTS_FULL`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeV1'
        '503':
          $ref: '#/components/responses/ServiceUnavailableV1'
    delete:
      tags: [Mobile Companion API v1]
      summary: Remove a contact
      description: |
        Delete the contact and its stored row. Emits a `contact` journal event
        with `change: remove`, so other synced devices drop it too.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/CompanionRegistrationName'
        - name: pubkey
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{64}$'
      responses:
        '200':
          description: Removed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [removed]
                        properties:
                          removed:
                            type: boolean
        '404':
          description: Contact (or companion) not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '503':
          $ref: '#/components/responses/ServiceUnavailableV1'

  /v1/companions/{name}/channels/{index}:
    put:
      tags: [Mobile Companion API v1]
      summary: Join or rename a channel
      description: |
        Set channel slot `{index}` to `{name, secret}`.

        **`secret` is write-only.** It is accepted here but never returned by
        any v1 endpoint — `snapshot.channels` exposes `{index, name}` only, and
        the `channel` journal event carries no secret either (architecture §8). Clients
        learn the PSK out of band (QR code, invite link), exactly as MeshCore
        clients do.

        This is what makes channel *joining* possible over REST at all: before
        it, a client could only use channels already configured on the
        repeater, because the surface withheld secrets and had no way to accept
        one.

        Emits a `channel` journal event (`change: update`). Use `DELETE` to
        clear a slot — an empty `name` here is a `400`.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/CompanionRegistrationName'
        - name: index
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, secret]
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 32
                  description: Non-blank channel name; maximum 32 UTF-8 bytes.
                secret:
                  type: string
                  pattern: '^(?:[0-9a-fA-F]{32}|[0-9a-fA-F]{64})$'
                  description: |
                    Channel PSK as hex — 32 or 64 characters (16 or 32 bytes).
                    Write-only; never returned.
      responses:
        '200':
          description: |
            Channel set. The response echoes `{index, name}` only — never the
            secret.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [channel]
                        properties:
                          channel:
                            type: object
                            required: [index, name]
                            properties:
                              index:
                                type: integer
                              name:
                                type: string
        '400':
          description: |
            Missing `name`, non-hex `secret`, wrong secret length, or a
            non-integer index.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '404':
          description: Channel index out of range, or companion not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeV1'
        '503':
          $ref: '#/components/responses/ServiceUnavailableV1'
    delete:
      tags: [Mobile Companion API v1]
      summary: Clear a channel slot
      description: |
        Clear the slot. Emits a `channel` journal event with
        `change: remove` and `name: null`.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/CompanionRegistrationName'
        - name: index
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Cleared.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [removed]
                        properties:
                          removed:
                            type: boolean
        '404':
          description: Channel not configured, or companion not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '503':
          $ref: '#/components/responses/ServiceUnavailableV1'

  /v1/companions/{name}/contacts/{pubkey}/login:
    post:
      tags: [Mobile Companion API v1]
      summary: Room/repeater login for a contact
      description: |
        Mirrors the legacy `/api/companion/login` bridge call. This is an RF
        action and shares the Mobile API's per-principal/global RF admission
        budget. It has no idempotency key; do not blindly retry a timeout.
        The bridge timeout is 15 seconds.

        **Synchronous by design.** This blocks on the mesh round trip and
        returns the bridge result inline. It is deliberately not a queued
        command and does not create a later result event. A multi-hop round
        trip can exceed the request guard; HTTP 504 then means the remote
        outcome is unknown. Do not blindly retry. This small synchronous
        contract is the complete v1 behavior for login/status/telemetry.

      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/CompanionRegistrationName'
        - name: pubkey
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{64}$'
          description: Contact's 32-byte public key, hex-encoded.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                password:
                  type: string
                  default: ""
                  maxLength: 15
                  description: |
                    Maximum 15 UTF-8 bytes. NUL is rejected because MeshCore
                    login credentials are NUL-terminated.
      responses:
        '200':
          description: Login attempted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MobileActionResult'
        '400':
          description: |
            Invalid JSON body or invalid public key. Rendered as the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '401':
          description: Missing/invalid JWT or API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '404':
          description: |
            Companion not found — also returned for companions outside the
            caller's token scope (identical status and message, so a scoped
            device token cannot enumerate other companion names). Rendered as
            the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '405':
          description: |
            Method not allowed (POST only, no OPTIONS exception). Rendered as the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '429':
          description: RF admission limit exceeded. Includes `Retry-After`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '504':
          description: |
            Bridge coroutine timed out. Rendered as the v1 JSON error envelope (see tag
            description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '500':
          $ref: '#/components/responses/OperationFailedV1'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeV1'
        '503':
          $ref: '#/components/responses/ServiceUnavailableV1'

  /v1/companions/{name}/contacts/{pubkey}/connection:
    get:
      tags: [Mobile Companion API v1]
      summary: Read a contact's remote login-session state
      description: |
        Reports whether this companion currently tracks a non-expired login
        session with the contact. This mirrors Frame `HAS_CONNECTION`: it is
        remote mesh-session state, not the state of an HTTP, WebSocket, SSE,
        or Frame client connection.

        This is a local read and does not transmit RF or consume the RF
        admission budget. The response is transient and uses
        `Cache-Control: no-store`.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/CompanionRegistrationName'
        - name: pubkey
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{64}$'
          description: Contact's 32-byte public key, hex-encoded.
      responses:
        '200':
          description: Current remote login-session state.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [connected]
                        additionalProperties: false
                        properties:
                          connected:
                            type: boolean
        '400':
          description: Invalid public key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '401':
          description: Missing/invalid JWT or API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '404':
          description: |
            Companion not found — also returned for companions outside the
            caller's token scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '405':
          description: Method not allowed (GET only).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '500':
          $ref: '#/components/responses/OperationFailedV1'
        '503':
          $ref: '#/components/responses/ServiceUnavailableV1'
        '504':
          description: Timed out waiting for the companion event loop.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'

  /v1/companions/{name}/contacts/{pubkey}/logout:
    post:
      tags: [Mobile Companion API v1]
      summary: End a contact's remote login session
      description: |
        Mirrors Frame `LOGOUT`. The server first orders this operation after
        any in-flight login for the same destination, clears its local login
        session, and then makes one best-effort RF logout send. `logged_out`
        therefore means the local session is closed; `sent` separately says
        whether the RF packet was queued.

        This action consumes the shared per-principal/global RF admission
        budget. It deliberately has no idempotency key: each call is one
        explicit best-effort logout send.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/CompanionRegistrationName'
        - name: pubkey
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{64}$'
          description: Contact's 32-byte public key, hex-encoded.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Local session ended and the RF send was attempted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [logged_out, sent]
                        additionalProperties: false
                        properties:
                          logged_out:
                            type: boolean
                            enum: [true]
                          sent:
                            type: boolean
        '400':
          description: Invalid public key, JSON body, or unexpected body field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '401':
          description: Missing/invalid JWT or API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '404':
          description: |
            Companion not found — also returned for companions outside the
            caller's token scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '405':
          description: Method not allowed (POST only).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '429':
          description: RF admission limit exceeded. Includes `Retry-After`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '500':
          $ref: '#/components/responses/OperationFailedV1'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeV1'
        '503':
