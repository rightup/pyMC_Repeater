  # ============================================================================
  # Identity Management
  # ============================================================================
  /create_identity:
    post:
      tags: [Identities]
      summary: Create new identity
      description: |
        Create a new companion or room server identity.
        `name` must be non-empty after trimming leading/trailing whitespace (whitespace-only values are rejected).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
                  pattern: '^[a-zA-Z0-9_\-\s]+$'
                  description: |
                    Identity registration name (alphanumeric, spaces, hyphens, underscores).
                    Trimmed; must not be empty or whitespace-only.
                  example: "General Chat"
                identity_key:
                  type: string
                  pattern: '^(?:[0-9a-fA-F]{64}|[0-9a-fA-F]{128})$'
                  description: 32- or 64-byte hex key (64 or 128 chars). Omit for auto-generation
                  example: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
                type:
                  type: string
                  enum: [companion, room_server]
                  description: |
                    - companion: Companion identity with a TCP endpoint
                    - room_server: Room server for group chat
                  example: room_server
                settings:
                  type: object
                  description: Type-specific settings
                  properties:
                    admin_password:
                      type: string
                      minLength: 4
                      description: Admin authentication password (room_server only)
                      example: "admin123"
                    guest_password:
                      type: string
                      minLength: 4
                      description: Guest authentication password (room_server only)
                      example: "guest123"
                    max_posts:
                      type: integer
                      minimum: 1
                      maximum: 32
                      default: 32
                      description: Maximum messages to keep (hard limit 32)
                      example: 32
                    node_name:
                      type: string
                      description: Advertised node name (companion only; defaults to identity name)
                      example: "My Companion"
                    tcp_port:
                      type: integer
                      minimum: 1
                      maximum: 65535
                      default: 5000
                      description: TCP listener port (companion only)
                      example: 5000
                    bind_address:
                      type: string
                      default: "0.0.0.0"
                      description: TCP listener bind address (companion only)
                      example: "0.0.0.0"
            examples:
              room_server:
                value:
                  name: "General Chat"
                  type: room_server
                  settings:
                    admin_password: "admin123"
                    guest_password: "guest123"
                    max_posts: 32
              companion:
                value:
                  name: "My Companion"
                  type: companion
                  identity_key: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
                  settings:
                    node_name: "My Companion"
                    tcp_port: 5000
                    bind_address: "0.0.0.0"
      responses:
        '200':
          description: Identity created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      name:
                        type: string
                      type:
                        type: string
                      hash:
                        type: string
                      public_key:
                        type: string
              examples:
                success:
                  value:
                    success: true
                    data:
                      name: "General Chat"
                      type: room_server
                      hash: "0x42"
                      public_key: "abc123..."
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /identities:
    get:
      tags: [Identities]
      summary: List all identities
      description: |
        Returns configured room servers and companions plus runtime registration info.
        Companion entries with missing or blank registration names are assigned a stable
        `companion_<pubkeyPrefix>` name derived from the identity key and persisted when possible.
      responses:
        '200':
          description: List of identities
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      identities:
                        type: array
                        items:
                          $ref: '#/components/schemas/Identity'

  /identity:
    get:
      tags: [Identities]
      summary: Get specific identity
      description: Retrieve details of a specific identity by name
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
          description: Identity name to retrieve
      responses:
        '200':
          description: Identity details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Identity'

  /update_identity:
    put:
      tags: [Identities]
      summary: Update identity
      description: |
        Modify an existing identity's configuration.
        For `room_server`, `name` is required to locate the identity.
        For `companion`, provide `name` OR `lookup_identity_key` OR `public_key_prefix`
        (at least 8 hex characters for prefix lookups) when the registration name is unknown.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: [room_server, companion]
                  default: room_server
                name:
                  type: string
                  description: Current identity registration name (required for room_server; optional for companion if lookup fields are set)
                lookup_identity_key:
                  type: string
                  description: |
                    Companion only: hex private identity key (full or unique prefix, min 8 hex chars)
                    to locate the companion when `name` is omitted.
                public_key_prefix:
                  type: string
                  description: |
                    Companion only: ed25519 public key hex prefix (min 8 hex chars) to locate the companion when `name` is omitted.
                new_name:
                  type: string
                  description: New identity name (optional; must be non-empty if provided)
                identity_key:
                  type: string
                  description: New identity key (optional)
                settings:
                  type: object
                  description: Updated settings
      responses:
        '200':
          description: Identity updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /delete_identity:
    delete:
      tags: [Identities]
      summary: Delete identity
      description: |
        Remove an identity from the system.
        For `room_server`, `name` is required.
        For `companion`, provide `name` OR `lookup_identity_key` OR `public_key_prefix`
        (at least 8 hex characters for prefix lookups).
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Identity registration name to delete (required for room_server)
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [room_server, companion]
          description: Identity kind (default room_server)
        - name: lookup_identity_key
          in: query
          required: false
          schema:
            type: string
          description: |
            Companion only: hex identity key (full or unique prefix, min 8 hex chars) when `name` is omitted.
        - name: public_key_prefix
          in: query
          required: false
          schema:
            type: string
          description: |
            Companion only: public key hex prefix (min 8 hex chars) when `name` is omitted.
      responses:
        '200':
          description: Identity deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /send_room_server_advert:
    post:
      tags: [Identities]
      summary: Send room server advertisement
      description: Broadcast a room server advertisement packet
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: Room server identity name
                node_name:
                  type: string
                  description: Node name for the advertisement
                latitude:
                  type: number
                  format: float
                  description: GPS latitude
                  example: 0.0
                longitude:
                  type: number
                  format: float
                  description: GPS longitude
                  example: 0.0
                disable_fwd:
                  type: boolean
                  description: Disable forwarding flag
                  default: false
      responses:
        '200':
          description: Advertisement sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # ============================================================================
  # ACL (Access Control List)
  # ============================================================================
  /acl_info:
    get:
      tags: [ACL]
      summary: Get ACL information for all identities
      description: |
        Get ACL configuration and statistics for all registered identities.

        Returns information including:
        - Identity name, type, and hash
        - Max clients allowed
        - Number of authenticated clients
        - Password configuration status
        - Read-only access setting
      responses:
        '200':
          description: ACL information for all identities
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      acls:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              example: "repeater"
                            type:
                              type: string
                              enum: [repeater, room_server]
                              example: "repeater"
                            hash:
                              type: string
                              pattern: '^0x[0-9a-fA-F]{2}$'
                              example: "0x42"
                            max_clients:
                              type: integer
                              example: 100
                            authenticated_clients:
                              type: integer
                              example: 5
                            has_admin_password:
                              type: boolean
                              example: true
                            has_guest_password:
                              type: boolean
                              example: true
                            allow_read_only:
                              type: boolean
                              example: true
                      total_identities:
                        type: integer
                        example: 3
                      total_authenticated_clients:
                        type: integer
                        example: 15

  /acl_clients:
    get:
      tags: [ACL]
      summary: List ACL clients
      description: Get list of authenticated clients in access control list for an identity
      parameters:
        - name: identity_hash
          in: query
          schema:
            type: string
            pattern: '^0x[0-9a-fA-F]{2}$'
          description: Identity hash
          example: "0x42"
        - name: identity_name
          in: query
          schema:
            type: string
          description: Identity name
          example: "General"
      responses:
        '200':
          description: ACL clients list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      clients:
                        type: array
                        items:
                          $ref: '#/components/schemas/ACLClient'
                      count:
                        type: integer
                        description: Number of clients returned
                      filter:
                        type: string
                        nullable: true
                        description: Filter applied (if any)
              examples:
                success:
                  value:
                    success: true
                    data:
                      clients:
                        - public_key: "03ccf3bb0bed9a51...21416fff"
                          public_key_full: "03ccf3bb0bed9a5109868a1e33ed020519aab6dbb30e42df3b11a21d21416fff"
                          address: "e1"
                          permissions: "admin"
                          last_activity: 1766065148
                          last_login_success: 1766065146
                          last_timestamp: 1766065146
                          identity_name: "rrrrr"
                          identity_type: "room_server"
                          identity_hash: "0xC5"
                      count: 1
                      filter: null

  /acl_remove_client:
    post:
      tags: [ACL]
      summary: Remove client from ACL
      description: Remove a client from the access control list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identity_hash, client_pubkey]
              properties:
                identity_hash:
                  type: string
                  pattern: '^0x[0-9a-fA-F]{2}$'
                  description: Identity hash
                  example: "0x42"
                identity_name:
                  type: string
                  description: Identity name (alternative to hash)
                  example: "General"
                client_pubkey:
                  type: string
                  pattern: '^[0-9a-fA-F]{64}$'
                  description: Client public key to remove
                  example: "abc123def456..."
      responses:
        '200':
          description: Client removed from ACL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /acl_stats:
    get:
      tags: [ACL]
      summary: Get ACL statistics
      description: Get statistics about access control lists
      responses:
        '200':
          description: ACL statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      total_entries:
                        type: integer
                      by_identity:
                        type: object

  /room_messages:
    get:
      tags: [Room Server]
      summary: Get room messages
      description: |
        Retrieve messages from a room with pagination.

        **Max Messages Per Room**: 32 (hard limit)
        - Older messages auto-deleted every 10 minutes
        - Cannot be increased beyond 32
      parameters:
        - name: room_name
          in: query
          schema:
            type: string
          description: Name of the room (use this OR room_hash)
          example: General
        - name: room_hash
          in: query
          schema:
            type: string
            pattern: '^0x[0-9a-fA-F]{2}$'
          description: Hash of room identity (use this OR room_name)
          example: "0x42"
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
          description: Max messages to return
          example: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Skip first N messages (for pagination)
          example: 0
        - name: since_timestamp
          in: query
          schema:
            type: number
            format: float
          description: Only return messages after this Unix timestamp
          example: 1734567890.5
      responses:
        '200':
          description: Messages retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      room_name:
                        type: string
                      room_hash:
                        type: string
                      messages:
                        type: array
                        items:
                          $ref: '#/components/schemas/RoomMessage'
                      count:
                        type: integer
                        description: Number of messages in this response
                      total:
                        type: integer
                        description: Total messages in room (max 32)
                      limit:
                        type: integer
                      offset:
                        type: integer
              examples:
                success:
                  value:
                    success: true
                    data:
                      room_name: "General"
                      room_hash: "0x42"
                      messages:
                        - id: 123
                          author_pubkey: "abc123def456..."
                          author_prefix: "abc123de"
                          post_timestamp: 1734567890.5
                          sender_timestamp: 1734567890
                          message_text: "Hello world"
                          txt_type: 0
                          created_at: 1734567890.5
                      count: 1
                      total: 15
                      limit: 50
                      offset: 0
        '404':
          description: Room not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /room_post_message:
    post:
      tags: [Room Server]
      summary: Post message to room
      description: |
        Add a new message to a room server. Message will be distributed to all synced clients.

        **Special author values:**
        - `"server"` or `"system"` - System message, goes to ALL clients (API only)
        - Any hex string - Normal message, NOT sent to that client

        **Security:**
        - Radio messages cannot use server key (blocked)
        - API messages can use server key (for announcements)

        **Rate Limits:**
        - 10 messages/minute per author_pubkey
        - 160 bytes max message length
        - Global 1.1s gap between transmissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message, author_pubkey]
              properties:
                room_name:
                  type: string
                  description: Name of the room (use this OR room_hash)
                  example: General
                room_hash:
                  type: string
                  pattern: '^0x[0-9a-fA-F]{2}$'
                  description: Hash of room identity (use this OR room_name)
                  example: "0x42"
                message:
                  type: string
                  minLength: 1
                  maxLength: 160
                  description: Message text (auto-truncated at 160 bytes)
                  example: "Hello from API"
                author_pubkey:
                  type: string
                  description: |
                    Author's public key as hex string (64 chars), or special values:
                    - "server" = system message (all clients receive)
                    - "system" = alias for "server"
                    - hex string = normal message (author won't receive)
                  example: "abc123def456..."
                txt_type:
                  type: integer
                  default: 0
                  enum: [0, 2]
                  description: |
                    Message type:
                    - 0: Plain text
                    - 2: Signed plain text
                  example: 0
            examples:
              normal_message:
                summary: Normal message
                value:
                  room_name: "General"
                  message: "Hello everyone!"
                  author_pubkey: "abc123def456..."
                  txt_type: 0
              server_message:
                summary: Server announcement
                value:
                  room_name: "General"
                  message: "[SERVER] Maintenance in 10 minutes"
                  author_pubkey: "server"
              by_hash:
                summary: Post by room hash
                value:
                  room_hash: "0x42"
                  message: "Using hash instead of name"
                  author_pubkey: "abc123..."
      responses:
        '200':
          description: Message posted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      message_id:
                        type: integer
                        description: Database ID of created message
                      room_name:
                        type: string
                      room_hash:
                        type: string
                      queued_for_distribution:
                        type: boolean
                        description: Always true - distribution is async
                      is_server_message:
                        type: boolean
                        description: True if author_pubkey was "server"
                      author_filter_note:
                        type: string
                        description: Explains message distribution behavior
              examples:
                normal:
                  value:
                    success: true
                    data:
                      message_id: 124
                      room_name: "General"
                      room_hash: "0x42"
                      queued_for_distribution: true
                      is_server_message: false
                      author_filter_note: "Message will NOT be sent to author"
                server:
                  value:
                    success: true
                    data:
                      message_id: 125
                      room_name: "General"
                      room_hash: "0x42"
                      queued_for_distribution: true
                      is_server_message: true
                      author_filter_note: "Server messages go to ALL clients"
        '400':
          description: Invalid parameters or rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                rate_limit:
                  value:
                    success: false
                    error: "Failed to add message (rate limit or validation error)"
                missing_field:
                  value:
                    success: false
                    error: "message is required"

  /room_stats:
    get:
      tags: [Room Server]
      summary: Get room statistics
      description: |
        Get detailed statistics for one or all room servers.

        **Room Limits:**
        - 32 messages maximum per room (hard limit)
        - Messages auto-expire every 10 minutes
        - Author filtering: messages not sent back to author
      parameters:
        - name: room_name
          in: query
          schema:
            type: string
          description: Get stats for specific room (omit for all rooms)
          example: General
        - name: room_hash
          in: query
          schema:
            type: string
            pattern: '^0x[0-9a-fA-F]{2}$'
          description: Get stats by room hash (use this OR room_name)
          example: "0x42"
      responses:
        '200':
          description: Room statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      room_name:
                        type: string
                      room_hash:
                        type: string
                      total_messages:
                        type: integer
                        minimum: 0
                        maximum: 32
                        description: Current message count (max 32)
                        example: 15
                      total_clients:
                        type: integer
                        minimum: 0
                        description: Total clients that have synced
                        example: 8
                      active_clients:
                        type: integer
                        minimum: 0
                        description: Clients active within timeout window
                        example: 3
                      max_posts:
                        type: integer
                        minimum: 1
                        maximum: 32
                        description: Message limit setting (always 32)
                        example: 32
                      sync_running:
                        type: boolean
                        description: Distribution task is active
                        example: true
                      clients:
                        type: array
                        description: List of all clients with sync status
                        items:
                          $ref: '#/components/schemas/RoomClient'
              examples:
                single_room:
                  value:
                    success: true
                    data:
                      room_name: "General"
                      room_hash: "0x42"
                      total_messages: 15
                      total_clients: 8
                      active_clients: 3
                      max_posts: 32
                      sync_running: true
                      clients:
                        - pubkey: "abc123..."
                          pubkey_prefix: "abc123de"
                          sync_since: 1734567890.5
                          unsynced_count: 5
                          is_active: true
                all_rooms:
                  value:
                    success: true
                    data:
                      rooms:
                        - room_name: "General"
                          total_messages: 15
                          active_clients: 3
                        - room_name: "Tech"
                          total_messages: 8
                          active_clients: 1
        '404':
          description: Room not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /room_clients:
    get:
      tags: [Room Server]
      summary: Get room clients
      description: |
        List all clients synced to a room with their status.

        **Client Filtering:**
        - Clients only receive messages where author_pubkey ≠ client_pubkey
        - unsynced_count shows pending messages for each client
        - is_active indicates client synced within timeout window
      parameters:
        - name: room_name
          in: query
          schema:
            type: string
          description: Room name
          example: General
        - name: room_hash
          in: query
          schema:
            type: string
            pattern: '^0x[0-9a-fA-F]{2}$'
          description: Room hash (use this OR room_name)
          example: "0x42"
      responses:
        '200':
          description: Client list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      room_name:
                        type: string
                      room_hash:
                        type: string
                      clients:
                        type: array
                        items:
                          $ref: '#/components/schemas/RoomClient'
              examples:
                success:
                  value:
                    success: true
                    data:
                      room_name: "General"
                      room_hash: "0x42"
                      clients:
                        - pubkey: "abc123def456..."
                          pubkey_prefix: "abc123de"
                          sync_since: 1734567890.5
                          unsynced_count: 5
                          pending_ack: false
                          push_failures: 0
                          last_activity: 1734567890.5
                          in_acl: true
                          is_active: true
        '404':
          description: Room not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

