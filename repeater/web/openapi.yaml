          type: string
          nullable: true

    RoomMessage:
      type: object
      required: [id, author_pubkey, post_timestamp, message_text, txt_type]
      properties:
        id:
          type: integer
          description: Database message ID
          example: 123
        author_pubkey:
          type: string
          pattern: '^[0-9a-fA-F]{64}$|^00{64}$'
          description: |
            Author's public key (64 hex chars):
            - 32 zeros (64 '0's) = server/system message
            - Other hex = regular user message
          example: "abc123def456..."
        author_prefix:
          type: string
          pattern: '^[0-9a-fA-F]{8}$'
          description: First 8 chars of author_pubkey (for display)
          example: "abc123de"
        post_timestamp:
          type: number
          format: float
          description: Server timestamp when message was stored (Unix epoch)
          example: 1734567890.5
        sender_timestamp:
          type: integer
          description: Client-provided timestamp (may be inaccurate)
          example: 1734567890
        message_text:
          type: string
          maxLength: 160
          description: Message content (auto-truncated at 160 bytes)
          example: "Hello world"
        txt_type:
          type: integer
          enum: [0, 2]
          description: |
            Message type:
            - 0: Plain text
            - 2: Signed plain text
          example: 0
        created_at:
          type: number
          format: float
          description: Database insertion timestamp (Unix epoch)
          example: 1734567890.5

    RoomClient:
      type: object
      required: [pubkey, sync_since, unsynced_count, is_active]
      properties:
        pubkey:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
          description: Client's public key (64 hex chars)
          example: "abc123def456..."
        pubkey_prefix:
          type: string
          pattern: '^[0-9a-fA-F]{8}$'
          description: First 8 chars of pubkey (for display)
          example: "abc123de"
        sync_since:
          type: number
          format: float
          description: Last sync timestamp (Unix epoch)
          example: 1734567890.5
        unsynced_count:
          type: integer
          minimum: 0
          maximum: 32
          description: Number of new messages for this client (max 32, messages NOT sent to author)
          example: 5
        pending_ack:
          type: boolean
          description: Waiting for ACK from client
          example: false
        push_failures:
          type: integer
          minimum: 0
          description: Number of failed delivery attempts
          example: 0
        last_activity:
          type: number
          format: float
          description: Last activity timestamp (Unix epoch)
          example: 1734567890.5
        in_acl:
          type: boolean
          description: Client passes ACL check
          example: true
        is_active:
          type: boolean
          description: Client is currently active (synced within timeout period)
          example: true

    RegisteredIdentity:
      type: object
      description: One live identity-manager registration.
      required: [name, type, hash, public_key, address]
      properties:
        name:
          type: string
          description: Runtime registration name, including its type prefix.
          example: "companion:my-companion"
        type:
          type: string
          enum: [repeater, room_server, companion]
        hash:
          type: string
          pattern: '^0x[0-9a-fA-F]{2}$'
        public_key:
          type: string
          nullable: true
          pattern: '^[0-9a-fA-F]{64}$'
        address:
          type: string
          description: Runtime address hex, or `N/A` for an unavailable identity object.

    Identity:
      type: object
      description: |
        One configured room-server or companion identity. Top-level identity
        fields always describe configuration, never an unrelated live object.
        Derived fields are null when a malformed legacy identity key cannot be
        decoded.
      required: [name, type, settings, hash, public_key, address, registered]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            Identity registration name. Companion values are the stricter
            stable slug `^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$`; human-facing
            companion text is in `settings.node_name`.
          example: "General Chat"
        type:
          type: string
          enum: [repeater, room_server, companion]
          description: |
            - repeater: Repeater identity (only one allowed per system)
            - room_server: Room server for group chat
            - companion: Frame/REST companion identity sharing the repeater radio
          example: room_server
        hash:
          type: string
          nullable: true
          pattern: '^0x[0-9a-fA-F]{2}$'
          description: 1-byte configured identity hash (used in radio packets).
          example: "0x42"
        public_key:
          type: string
          nullable: true
          pattern: '^[0-9a-fA-F]{64}$'
          description: Configured Ed25519 public key (64 hex chars).
          example: "abcdefabcdefabcdefabcdefabcdefabcdefabcdefabcdefabcdefabcdefabcd"
        address:
          type: string
          nullable: true
          pattern: '^[0-9a-fA-F]+$'
          description: Address derived from the configured identity.
        registered:
          type: boolean
          description: |
            True only when a live identity has the configured type and exact
            full public key.
        settings:
          type: object
          description: Type-specific settings
          properties:
            admin_password_configured:
              type: boolean
              description: Whether an admin password is stored (room_server only).
            guest_password_configured:
              type: boolean
              description: Whether a guest password is stored (room_server only).
            max_posts:
              type: integer
              minimum: 1
              maximum: 32
              default: 32
              description: Maximum messages to keep (room_server only, hard limit 32)
              example: 32
            node_name:
              type: string
              description: Human-facing companion name; maximum 31 bytes of UTF-8.
            frame_enabled:
              type: boolean
              default: true
              description: |
                Whether the upstream-compatible companion TCP frame listener is
                enabled. REST/SSE and the shared bridge remain active when false.
            tcp_port:
              type: integer
              minimum: 1
              maximum: 65535
              default: 5000
              description: Companion frame-listener port.
            tcp_timeout:
              type: integer
              minimum: 0
              maximum: 2147483647
              default: 28800
              description: Companion frame-client idle seconds; `0` disables the timeout.
            bind_address:
              type: string
              default: "127.0.0.1"
              description: |
                Companion frame-listener bind. Loopback is the safe default
                because the frame protocol is unauthenticated.
            adopt_legacy_namespace:
              type: boolean
              default: false
              description: |
                One-time companion recovery setting. Claims verified unbound
                legacy rows for this full public identity; it never replaces
                an existing namespace binding.
            max_contacts:
              type: integer
              minimum: 1
              default: 1000
              description: Maximum durable contacts for this companion.
            offline_queue_size:
              type: integer
              minimum: 0
              maximum: 4096
              default: 512
              description: |
                Bounded pending queue for frame delivery. `0` disables offline
                frame queuing; REST history remains durable.
            trim_contacts_on_overflow:
              type: boolean
              default: false
              description: |
                Trim oldest non-favourite contacts on startup when persisted
                contacts exceed `max_contacts`.
            rf_reception_events:
              type: boolean
              default: false
              description: |
                Include high-volume uncorrelated RF reception events in this
                companion's journal.
        runtime:
          type: object
          description: |
            Optional live-runtime observation. An absent registration is
            represented as `{registered: false}`. When a live identity is
            present, all remaining fields are included; a mismatched runtime
            stays here and never replaces the configured top-level fields.
          required: [registered]
          properties:
            hash:
              type: string
              nullable: true
              pattern: '^0x[0-9a-fA-F]{2}$'
            public_key:
              type: string
              nullable: true
              pattern: '^[0-9a-fA-F]{64}$'
            address:
              type: string
              nullable: true
              pattern: '^[0-9a-fA-F]+$'
            type:
              type: string
              nullable: true
              enum: [repeater, room_server, companion]
            registered:
              type: boolean
            matches_configuration:
              type: boolean

    ACLClient:
      type: object
      required: [public_key, public_key_full, address, permissions]
      properties:
        public_key:
          type: string
          description: Truncated public key for display (first 24 and last 8 chars)
          example: "03ccf3bb0bed9a51...21416fff"
        public_key_full:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
          description: Full client public key (64 hex chars)
          example: "03ccf3bb0bed9a5109868a1e33ed020519aab6dbb30e42df3b11a21d21416fff"
        address:
          type: string
          description: Client address identifier
          example: "e1"
        permissions:
          type: string
          enum: [admin, guest, read_only]
          description: |
            Client permission level:
            - admin: Full access
            - guest: Limited access
            - read_only: Read-only access
          example: "admin"
        last_activity:
          type: integer
          description: Unix timestamp of last activity
          example: 1766065148
        last_login_success:
          type: integer
          description: Unix timestamp of last successful login
          example: 1766065146
        last_timestamp:
          type: integer
          description: Unix timestamp from last client message
          example: 1766065146
        identity_name:
          type: string
          description: Name of the identity this client is authenticated to
          example: "rrrrr"
        identity_type:
          type: string
          enum: [repeater, room_server]
          description: Type of identity
          example: "room_server"
        identity_hash:
          type: string
          pattern: '^0x[0-9a-fA-F]{2}$'
          description: Hash of the identity
          example: "0xC5"

    MobileCompanionSummary:
      type: object
      description: One entry from `GET /api/v1/companions` (scope-filtered).
      required: [name, companion_hash, node_name, public_key]
      properties:
        name:
          $ref: '#/components/schemas/CompanionRegistrationName'
        companion_hash:
          type: string
          pattern: '^0x[0-9a-f]{2}$'
          example: "0xa4"
        node_name:
          type: string
          description: Human-facing advertised name; at most 31 bytes of UTF-8.
        public_key:
          type: string
          description: Full ed25519 public key, hex-encoded (64 chars).

    MobileContact:
      type: object
      description: |
        One mobile contact. Snapshot entries, contact-mutation responses, and
        `contact` journal-event data use this same public shape. Raw path,
        advert packet, and storage-only fields are intentionally omitted. All
        listed fields are present; clients should reject missing or unexpected
        fields for this known shape.
      required:
        - public_key
        - name
        - adv_type
        - flags
        - favorite
        - out_path_len
        - last_advert_timestamp
        - lastmod
        - gps_lat
        - gps_lon
      properties:
        public_key:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Full contact public key, lowercase hex.
        name:
          type: string
        adv_type:
          type: integer
        flags:
          type: integer
          description: |
            Raw flag bitfield; bit 0 (`0x01`) marks a favourite. Other bits
            are server-managed.
        favorite:
          type: boolean
          description: Derived from `flags` bit 0.
        out_path_len:
          type: integer
        last_advert_timestamp:
          type: integer
        lastmod:
          type: integer
        gps_lat:
          type: number
          nullable: true
        gps_lon:
          type: number
          nullable: true

    MobileContactEvent:
      allOf:
        - $ref: '#/components/schemas/MobileContact'
        - type: object
          required: [change]
          properties:
            change:
              type: string
              enum: [new, update, remove, path]

    MobileSnapshot:
      type: object
      description: Bootstrap document returned by `GET .../snapshot`.
      required: [journal_epoch, cursor, self, contacts, channels, messages, server]
      properties:
        journal_epoch:
          type: string
          maxLength: 128
          pattern: '^[0-9a-f]+$'
          description: Opaque epoch id; changes if the journal is ever reset (e.g. DB restore).
        cursor:
          type: string
          maxLength: 128
          pattern: '^[0-9a-f]+:[0-9]+$'
          description: Reset-safe journal head in `epoch:seq` form. Store and echo it unchanged.
        self:
          type: object
          additionalProperties: false
          description: |
            Full public companion preference state. This is the reset-safe
            baseline for the same fields carried by later `prefs` journal
            events; radio tuning and secret scope material are excluded.
          required:
            - public_key
            - node_name
            - adv_type
            - latitude
            - longitude
            - autoadd_config
            - autoadd_max_hops
            - path_hash_mode
            - rx_delay_base
            - airtime_factor
            - client_repeat
            - manual_add_contacts
            - telemetry_mode_base
            - telemetry_mode_location
            - telemetry_mode_environment
            - advert_loc_policy
            - multi_acks
            - default_scope_name
          properties:
            public_key:
              type: string
              pattern: '^[0-9a-f]{64}$'
            node_name:
              type: string
            adv_type:
              type: integer
            latitude:
              type: number
            longitude:
              type: number
            autoadd_config:
              type: integer
            autoadd_max_hops:
              type: integer
            path_hash_mode:
              type: integer
            rx_delay_base:
              type: number
            airtime_factor:
              type: number
            client_repeat:
              type: integer
            manual_add_contacts:
              type: integer
            telemetry_mode_base:
              type: integer
            telemetry_mode_location:
              type: integer
            telemetry_mode_environment:
              type: integer
            advert_loc_policy:
              type: integer
            multi_acks:
              type: integer
            default_scope_name:
              type: string
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/MobileContact'
        channels:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [index, name]
            properties:
              index:
                type: integer
              name:
                type: string
          description: PSK secrets are never exposed on this surface.
        messages:
          type: array
          description: Most recent messages (default 100, max 200), oldest-first.
          items:
            $ref: '#/components/schemas/MobileMessage'
        server:
          type: object
          required: [version]
          properties:
            version:
              type: string
              nullable: true

    MobileMessage:
      type: object
      additionalProperties: false
      description: |
        A `companion_messages` row. `sender_key` and `channel_data_payload`
        are hex-encoded byte strings. Both inbound and outbound messages are
        durable; use `direction`, `state`, and `source` instead of inferring
        lifecycle from text or timestamps. Frame-delivery-only
        `pending_for_frame`/`consumed_at` markers are deliberately omitted:
        REST clients do not own the frame queue, and frame pops must not
        invalidate an otherwise unchanged REST snapshot.
      required:
        - id
        - companion_hash
        - sender_key
        - recipient_key
        - sender_prefix
        - txt_type
        - timestamp
        - text
        - is_channel
        - channel_idx
        - path_len
        - snr
        - rssi
        - channel_data_type
        - channel_data_payload
        - packet_hash
        - created_at
        - observation_count
        - unique_path_count
        - direction
        - state
        - expected_ack
        - source
      properties:
        id:
          type: integer
        companion_hash:
          type: string
          pattern: '^0x[0-9a-f]{2}$'
        sender_key:
          type: string
          pattern: '^(?:|[0-9a-f]{64})$'
        recipient_key:
          type: string
          pattern: '^(?:|[0-9a-f]{64})$'
          description: DM recipient public key; empty for inbound/channel messages.
        sender_prefix:
          type: string
          pattern: '^[0-9a-f]*$'
        txt_type:
          type: integer
        timestamp:
          type: integer
        text:
          type: string
        is_channel:
          type: boolean
        channel_idx:
          type: integer
        path_len:
          type: integer
        snr:
          type: number
        rssi:
          type: integer
        channel_data_type:
          type: integer
        channel_data_payload:
          type: string
          pattern: '^[0-9a-f]*$'
        packet_hash:
          type: string
          nullable: true
          pattern: '^[0-9A-F]{16}$'
          description: Canonical 16-hex-character uppercase correlation hash.
        created_at:
          type: number
        observation_count:
          type: integer
        unique_path_count:
          type: integer
        direction:
          type: string
          enum: [in, out]
        state:
          type: string
          enum: [received, pending, transmitted, heard_repeated, confirmed, failed, indeterminate]
        expected_ack:
          type: integer
          nullable: true
          minimum: 0
          maximum: 4294967295
        source:
          type: string
          nullable: true
          enum: [radio, rest, frame, operator]
    MobileJournalEvent:
      type: object
      description: |
        One event, identical shape whether delivered via `sync`'s `events`
        array or one SSE frame's `data:` line (architecture §6). `data` is
        type-specific per `type` — clients must ignore unrecognized types.
        This server preserves a safe unrecognized type and envelope so clients
        can advance their cursor, but emits its unreviewed `data` as `{}`.
        `snapshot_required` is reserved for the non-journal SSE reset control
        event and is never a durable journal `type`.

        Known `type` values and their `data` shapes:
        - `message` — a persisted inbound/outbound message (`data` mirrors a
          `companion_messages` row).
        - `contact` — a contact mutation; `change` is `new`, `update`,
          `remove`, or `path`.
        - `channel` — a channel slot was added, renamed or cleared:
          `{index, name, change: "update"|"remove"}`. `name` is `null` when
          `change` is `"remove"`. The PSK secret is **never** included —
          the snapshot withholds it (architecture §8) and a secret journaled here would
          reach every synced device *and* persist in the journal table.
          Emitted on a real change only: a rejected or no-op `SET_CHANNEL`
          produces nothing, and the bulk save at shutdown is not journaled
          (it would replay the whole table on every restart).
        - `prefs` — a bridge-preferences change. Note prefs are **observable
          but not settable** over `/api/v1`: the event reports changes made on
          any surface, but no v1 endpoint causes one.
        - `message_reception` — another RF copy of a known inbound message
          (architecture §12): `{message_id, packet_hash, path[], rssi, snr, observed_at,
          observation_count, unique_path_count}`.
        - `message_send_state` — an outbound lifecycle transition. Send-path
          transitions carry `{message_id, state, packet_hash, expected_ack}`.
          Heard-repeat transitions additionally carry path/signal and repeat
          counters.
        - `rf_reception` — the opt-in firehose (architecture §6): every OTA duplicate the
          repeater hears, regardless of companion relevance. **Off by
          default** — suppressed from `sync`/`events` output unless the caller
          passes `?include=rf_receptions` *and* the companion has the
          `rf_reception_events` setting enabled. `{packet_hash, rssi, snr,
          path[], observed_at}`. `path` here is raw hashes (not resolved).
      required: [seq, type, ts, packet_hash, data]
      properties:
        seq:
          type: integer
          minimum: 1
          maximum: 9223372036854775807
        type:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9_.-]+$'
          example: message
          description: |
            Event type. Known values are listed above; clients must ignore
            unrecognized future values rather than reject the page/stream.
        ts:
          type: number
        packet_hash:
          type: string
          nullable: true
          pattern: '^[0-9A-F]{16}$'
          description: |
            Correlation hash for the event. For `message`,
            `message_reception`, `message_send_state`, and `rf_reception`,
            this exactly matches `data.packet_hash` (including both being
            null where the event schema permits null).
        data:
          anyOf:
            - $ref: '#/components/schemas/MobileMessage'
            - $ref: '#/components/schemas/MobileContactEvent'
            - type: object
              description: |
                Payload for another known or forward-compatible event type;
                use `type` and ignore unrecognized future values.

    MobileSyncDelta:
      type: object
      description: A valid journal page; continue from `next_cursor`.
      required:
        - journal_epoch
        - events
        - next_cursor
        - has_more
        - snapshot_required
      properties:
        journal_epoch:
          type: string
          maxLength: 128
          pattern: '^[0-9a-f]+$'
        events:
          type: array
          items:
            $ref: '#/components/schemas/MobileJournalEvent'
        next_cursor:
          type: string
          maxLength: 128
          pattern: '^[0-9a-f]+:[0-9]+$'
        has_more:
          type: boolean
        snapshot_required:
          type: boolean
          enum: [false]

    MobileSyncReset:
      type: object
      description: |
        The supplied cursor cannot produce a complete delta. Fetch a fresh
        snapshot and resume from that snapshot's cursor.
      required:
        - journal_epoch
        - events
        - next_cursor
        - has_more
        - snapshot_required
        - reset_reason
      properties:
        journal_epoch:
          type: string
          maxLength: 128
          pattern: '^[0-9a-f]+$'
        events:
          type: array
          maxItems: 0
          items:
            $ref: '#/components/schemas/MobileJournalEvent'
        next_cursor:
          type: string
          maxLength: 128
          pattern: '^[0-9a-f]+:[0-9]+$'
        has_more:
          type: boolean
          enum: [false]
        snapshot_required:
          type: boolean
          enum: [true]
        reset_reason:
          type: string
          enum: [missing_epoch, epoch_mismatch, future_cursor, pruned_cursor]

    MobileActionResult:
      type: object
      description: |
        Open JSON-safe `data` returned by the synchronous contact-action
        endpoints (login/status_request/telemetry_request). Exact fields
        depend on the companion bridge library version; no later result-event
        schema is promised.

    MobileAnonymousRequestResult:
      type: object
      required: [success]
      additionalProperties: false
      properties:
        success:
          type: boolean
        error:
          type: string
        public_key:
          type: string
          pattern: '^[0-9a-f]{64}$'
        request:
          type: string
          enum: [regions, owner, basic]
        response:
          type: object
          additionalProperties: false
          properties:
            type:
              type: string
              enum: [regions, owner, basic]
            clock:
              type: integer
              minimum: 0
              maximum: 4294967295
            regions:
              type: array
              items:
                type: string
            node_name:
              type: string
            owner_info:
              type: string
            features:
              type: integer
              minimum: 0
              maximum: 255
            is_bridge:
              type: boolean
            bridge_type:
              type: integer
              minimum: 0
              maximum: 3
            is_disabled:
              type: boolean
            raw_hex:
              type: string
              pattern: '^[0-9a-f]*$'
            anon_sub_type:
              type: integer
              minimum: 0
              maximum: 255

    MobileDiscoveredRoute:
      type: object
      required: [encoded_length, hop_count, hash_size, hops]
      additionalProperties: false
      properties:
        encoded_length:
          type: integer
          minimum: 0
          maximum: 191
        hop_count:
          type: integer
          minimum: 0
          maximum: 63
        hash_size:
          type: integer
          minimum: 1
          maximum: 3
        hops:
          type: array
          maxItems: 63
          items:
            type: string
            pattern: '^(?:[0-9a-f]{2}|[0-9a-f]{4}|[0-9a-f]{6})$'

    MobilePathDiscoveryResult:
      type: object
      required: [success]
      additionalProperties: false
      properties:
        success:
          type: boolean
        error:
          type: string
        public_key:
          type: string
          pattern: '^[0-9a-f]{64}$'
        outbound:
          $ref: '#/components/schemas/MobileDiscoveredRoute'
        inbound:
          $ref: '#/components/schemas/MobileDiscoveredRoute'

    MobilePingResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        error:
          type: string
        snr_db:
          type: number
        rssi:
          type: integer
        rtt_ms:
          type: integer
          minimum: 0
        hop_count:
          type: integer
          minimum: 0
        trace_hop_count:
          type: integer
          minimum: 0
        trace_hash_size:
          type: integer
          minimum: 1

    ResolvedPathElement:
      type: object
      description: |
        One hop of an RF path (architecture §12). Path entries are abbreviated
        hashes (commonly one byte) that genuinely collide, so every rendered
        element carries both the raw value and its interpretation against the
        companion's current contacts. Clients display `raw_hash` unless
        `resolution` is `unique`. Resolution is computed at read time, so it
        can improve as contacts are learned.
      required: [raw_hash, resolution, candidates]
      properties:
        raw_hash:
          description: The raw path element as stored (opaque; usually a short hex string).
        resolution:
          type: string
          enum: [unique, ambiguous, unknown]
          description: |
            `unique` = exactly one contact prefix-matches; `ambiguous` = more
            than one; `unknown` = none (or a blank element).
        candidates:
          type: array
          description: Prefix-matching contacts, capped at 5.
          items:
            type: object
            required: [pubkey, name]
            properties:
              pubkey:
                type: string
                description: Full contact public key, lowercase hex.
              name:
                type: string
        truncated:
          type: boolean
          description: Present and true only when more than 5 contacts matched and `candidates` was capped.

    RfReception:
      type: object
      description: One RF copy of a message's `packet_hash` (architecture §12).
      required: [observed_at, rssi, snr, path, is_duplicate, transmitted]
      properties:
        observed_at:
          type: number
          description: Arrival timestamp, epoch seconds.
        rssi:
          type: number
          nullable: true
        snr:
          type: number
          nullable: true
        path:
          type: array
          description: Incoming path, each hop resolved (architecture §12).
          items:
            $ref: '#/components/schemas/ResolvedPathElement'
        is_duplicate:
          type: boolean
        transmitted:
          type: boolean
          description: True if this row is one we retransmitted.

    RfPathAggregate:
      type: object
      description: One distinct incoming path for a contact, with signal stats (architecture §12).
      required:
        - path
        - count
        - first_seen
        - last_seen
        - rssi_min
        - rssi_max
        - rssi_avg
        - snr_min
        - snr_max
        - snr_avg
        - first_hop
        - last_hop
      properties:
        path:
          type: array
          items:
            $ref: '#/components/schemas/ResolvedPathElement'
        count:
          type: integer
          description: Copies observed over this exact path in the window.
        first_seen:
          type: number
        last_seen:
          type: number
        rssi_min:
          type: number
          nullable: true
        rssi_max:
          type: number
          nullable: true
        rssi_avg:
          type: number
          nullable: true
        snr_min:
          type: number
          nullable: true
        snr_max:
          type: number
          nullable: true
        snr_avg:
          type: number
          nullable: true
        first_hop:
          allOf:
            - $ref: '#/components/schemas/ResolvedPathElement'
          nullable: true
          description: Convenience alias for `path[0]`, null for an empty path.
        last_hop:
          allOf:
            - $ref: '#/components/schemas/ResolvedPathElement'
          nullable: true
          description: Convenience alias for `path[-1]`, null for an empty path.

    RfHeardRepeat:
      type: object
      description: One heard repeat of our transmission (architecture §12).
      required: [observed_at, rssi, snr, path, terminal_repeater]
      properties:
        observed_at:
          type: number
        rssi:
          type: number
          nullable: true
        snr:
          type: number
          nullable: true
        path:
          type: array
          items:
            $ref: '#/components/schemas/ResolvedPathElement'
        terminal_repeater:
          allOf:
            - $ref: '#/components/schemas/ResolvedPathElement'
          nullable: true
          description: |
            The last path hop — the repeater that forwarded this copy to us
            (architecture §12). Null for an empty path.

  responses:
    UnsupportedMediaTypeV1:
      description: |
        A non-empty request body must use `Content-Type: application/json`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseV1'
    ServiceUnavailableV1:
      description: Required daemon, event-loop, journal, or durable storage state is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseV1'
    OperationFailedV1:
      description: The companion bridge or runtime operation failed unexpectedly.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseV1'

  parameters:
    LegacyCompanionNameQuery:
      name: companion_name
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/CompanionRegistrationName'
      description: Preferred legacy selector. Omit only when exactly one companion exists.
    LegacyCompanionHashQuery:
      name: companion_hash
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/LegacyCompanionHash'
      description: Compatibility selector used only when `companion_name` is absent.

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token authentication via the `Authorization: Bearer` header
        (web UI / `admin` scope). Also accepts a Mobile Companion API v1
        (`/api/v1/*`) device token minted by `POST /api/v1/pair`: the auth
        code (`repeater/web/auth/middleware.py`, `repeater/web/auth/
        cherrypy_tool.py`) tries the Bearer value as a JWT first, and falls
        back to a device-token lookup only if JWT verification fails, so a
        device token works equally well as `Authorization: Bearer <token>`
        or `X-API-Key: <token>` (see `ApiKeyAuth`). Companion-scoped device
        tokens are authorized only under `/api/v1`; they cannot enter auth,
        operator, legacy Repeater API, or WebSocket surfaces.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        API key header used by operator tokens and Mobile Companion device
        tokens. `Authorization: Bearer` accepts the same API-token values.
        Explicit scopes are `admin`, `companion:*`, or `companion:{name}`;
        unknown scopes fail closed. Pre-scope stored tokens with a NULL scope
        retain their legacy admin access. Paired devices are also bound to the
        companion's full public identity, so a configured name change does
        not silently retarget a device token.

# Security is declared per operation so the small public bootstrap/pairing
# surface remains explicit while every protected route names its auth modes.
