  /setup_wizard:
    post:
      tags: [System]
      summary: Submit setup wizard payload
      description: |
        Unauthenticated first-run mutation, accepted only while
        `public_bootstrap_allowed` from `/needs_setup` is true. A successful
        setup writes a non-default administrator password, sets the monotonic
        `repeater.setup_complete` marker, and schedules a service restart.
        Later changes use authenticated configuration endpoints.

        The JSON body is limited to **65,536 bytes**, duplicate keys and more
        than 64 nesting levels are rejected, and the top-level value must be
        an object.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [node_name, hardware_key, radio_preset, admin_password]
              properties:
                node_name:
                  type: string
                  minLength: 1
                  description: Non-blank; maximum 31 UTF-8 bytes.
                hardware_key:
                  type: string
                  minLength: 1
                radio_preset:
                  type: object
                  required: [frequency, bandwidth]
                  properties:
                    frequency:
                      type: number
                      description: MHz.
                    bandwidth:
                      type: number
                      description: kHz.
                    spreading_factor:
                      type: integer
                      default: 7
                    coding_rate:
                      type: integer
                      default: 5
                    tx_power:
                      type: integer
                      minimum: -9
                      maximum: 22
                admin_password:
                  type: string
                  format: password
                  writeOnly: true
                  minLength: 8
                  description: Must not be the public bootstrap default.
                  example: replace-with-a-unique-password
                kiss_port:
                  type: string
                kiss_baud_rate:
                  type: integer
                pymc_usb_port:
                  type: string
                pymc_usb_baudrate:
                  type: integer
                pymc_tcp_host:
                  type: string
                pymc_tcp_port:
                  type: integer
                pymc_tcp_token:
                  type: string
                  writeOnly: true
      responses:
        '200':
          description: |
            Setup applied, or a semantic validation error represented by
            `{success:false,error}`.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [success, message, config]
                    properties:
                      success:
                        type: boolean
                        enum: [true]
                      message:
                        type: string
                      config:
                        type: object
                  - $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Invalid Content-Length or malformed/unsafe JSON object.
        '403':
          description: Public bootstrap is closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Method not allowed (POST only).
        '413':
          description: JSON body exceeds 65,536 bytes.
        '415':
          description: Request body must use the application/json media type.

