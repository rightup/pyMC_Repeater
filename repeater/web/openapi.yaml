                  error:
                    type: string

  /config_import:
    post:
      tags: [System]
      summary: Import configuration
      description: |
        Restore allowed configuration sections from an export. Before first
        setup this may be called without credentials only while
        `/needs_setup` reports `public_bootstrap_allowed: true`. After that
        boundary closes, an authenticated administrator is required; a
        device-scoped or non-admin credential is not sufficient.

        A credentialless first-run restore must include a non-default
        `repeater.security.admin_password` of at least eight non-whitespace
        characters. A redacted, missing, empty, or `admin123` password is
        rejected so an import cannot close bootstrap with unusable or public
        credentials.

        A successful import sets `repeater.setup_complete: true` and cannot
        reopen public bootstrap, even when restoring an older/default config.
        Omitted or redacted nested security credentials are preserved. An
        explicit JWT secret must contain at least 32 UTF-8 bytes; null and
        empty legacy sentinels retain auto-generation. JWT expiry must be an
        integer from 1 through 10,080 minutes. An explicitly imported
        administrator password follows the login wire limit (1,024 UTF-8
        bytes), must pass the eight-character policy, and cannot be
        `admin123`. Invalid auth values are rejected before live state or disk
        is changed. Changing JWT secret/expiry or the repeater identity key
        returns `restart_required: true`; current sessions continue using the
        old runtime values until restart. JWT secret rotation also changes
        API-token hashing, so all current JWTs and stored API tokens become
        invalid after that restart. HTTP listener changes and CORS policy
        changes also return `restart_required: true`; the running request
        listener is never stopped or rebound from inside this operation.
        Other `web` values such as `site_name` remain live. Unknown top-level
        config sections are skipped. The JSON body is limited to **1,048,576 bytes**;
        duplicate keys, non-object bodies, and more than 64 nesting levels are
        rejected.
      security:
        - {}
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config]
              properties:
                config:
                  type: object
                  minProperties: 1
                  description: |
                    Exported configuration. Accepted sections are `repeater`,
                    `mesh`, `radio`, `sx1262`, `ch341`, `kiss`, `pymc_usb`,
                    `pymc_tcp`, `mqtt_brokers` (or legacy `mqtt`),
                    `identities`, `delays`, `http`, `web`, `letsmesh`, `glass`,
                    `logging`, and `radio_type`.
      responses:
        '200':
          description: |
            Import result. Semantic validation failures use the same HTTP
            status with `{success:false,error}`.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required:
                      - success
                      - message
                      - sections_updated
                      - saved
                      - restart_required
                    properties:
                      success:
                        type: boolean
                        enum: [true]
                      message:
                        type: string
                      sections_updated:
                        type: array
                        items:
                          type: string
                      saved:
                        type: boolean
                      restart_required:
                        type: boolean
                  - $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Invalid Content-Length or malformed/unsafe JSON object.
        '401':
          description: Supplied administrator credential is invalid.
        '403':
          description: |
            Public bootstrap is closed and administrator authentication was
            omitted, or the authenticated principal is not an administrator.
        '405':
          description: Method not allowed (POST only).
        '413':
          description: JSON body exceeds 1,048,576 bytes.
        '415':
          description: Request body must use the application/json media type.
        '503':
          description: |
            Persisted bootstrap state could not be authoritatively read, or the
            completed candidate could not be saved. No live configuration
            change is retained when persistence fails.

