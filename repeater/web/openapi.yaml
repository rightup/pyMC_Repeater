openapi: 3.0.0
info:
  title: openHop Repeater API
  description: |
    REST API for openHop Repeater - LoRa mesh network repeater with room server functionality.

    ## Features
    - System statistics and monitoring
    - Packet history and analysis
    - Identity management
    - Access Control Lists (ACL)
    - Room server messaging
    - CAD calibration
    - Noise floor monitoring
  version: 1.0.0
  contact:
    name: openHop Repeater
    url: https://github.com/openhop-dev/openhop_repeater

servers:
  - url: /api
    description: Current server (relative URLs with /api prefix)

tags:
  - name: Authentication
    description: User authentication and API token management
  - name: System
    description: System statistics and control
  - name: GPS
    description: Local GPS receiver diagnostics
  - name: Packets
    description: Packet history and statistics
  - name: Charts
    description: Graph data and RRD metrics
  - name: Noise Floor
    description: Noise floor monitoring
  - name: CAD Calibration
    description: Channel Activity Detection calibration
  - name: Adverts
    description: Advertisement and contact management
  - name: Transport Keys
    description: Transport encryption key management
  - name: Network Policy
    description: Network flood policy and neighbor management
  - name: Identities
    description: Identity management
  - name: ACL
    description: Access Control Lists
  - name: Room Server
    description: Room server messaging
  - name: Mobile Companion API v1
    description: |
      `/api/v1/*` — sync/action surface for first-party mobile companion
      clients (`repeater/web/mobile_endpoints.py`), per
      `docs/architecture/mobile-companion-api.md`. Distinct from the legacy
      `/api/companion/*` surface used by the web UI (`companion_endpoints.py`),
      which remains shape-compatible, operator-only, and unversioned. New chat
      clients must use `/api/v1`; legacy sends do not have its idempotency
      ledger.

      **Not a mirror of the TCP frame protocol.** The two surfaces differ in
      coverage *and* trust level: the frame protocol (port 5000 by default)
      is unauthenticated, hands out
      channel PSK secrets and can export the node's private key; this one
      deliberately exposes neither. Most omissions are intentional. See
      `docs/architecture/companion-frame-vs-rest.md` for the full inventory.

      Deliberate boundaries a client should know before designing around them:

      - **Contact import/export is absent.** Add and remove exist
        (`POST`/`DELETE .../contacts/{pubkey}`), but there is no equivalent of
        the frame protocol's share/export/import blob. Note also that
        `autoadd_config` / `autoadd_max_hops` — which decide whether an advert
        auto-adds a contact at all — are not settable here.
      - **Node prefs are observable but not settable.** The `prefs` journal
        event reports changes from any surface; no v1 endpoint causes one.
      - **Self-advert control is absent**: no set-name, set-latlon, or
        send-advert.
      - **Radio/tuning configuration, key export/import, signing and raw
        packet transmission are absent on purpose** and should stay that way:
        a device token is network-reachable, and these would turn a leaked one
        into an identity compromise or an arbitrary-transmit primitive.

      **Envelope:** successful JSON responses are
      `{"success": true, "data": …}`. JSON errors are
      `{"success": false, "error": "…"}` and may also include integer
      `status` and structured `data`.

      **Request media type:** every non-empty v1 request body requires
      `Content-Type: application/json`; other media types return `415`.
      Actions with no fields may omit the body or send an empty `{}` JSON
      object.

      **Caching and browser observability:** authenticated JSON success
      responses use `Cache-Control: no-store`. Snapshot 200/304 responses use
      `private, no-store, no-cache, no-transform` with `ETag`; credentialed SSE uses
      `no-store, no-cache, no-transform`. Allowed CORS origins can read `ETag`,
      `Idempotency-Replayed`, and `Retry-After`.

      **Common errors:** authenticated operations can return `401`; scope
      checks can return `403`/folded `404`; unavailable daemon, journal, or
      SQLite state returns `503`; and unexpected bridge/runtime failures
      return `500` or an action timeout `504`. These use `ErrorResponseV1`
      even when an operation below lists only its input- or resource-specific
      statuses. `304` snapshot and `204` preflight responses have no JSON
      body.

      **Auth:** `Bearer` — either a JWT (web UI / `admin` scope) or a scoped
      device API token minted by `POST /api/v1/pair` — or `X-API-Key` with
      that same device token (`ApiKeyAuth`). Bearer values are tried as a
      JWT first; if that fails, the same value is looked up as a device
      token before the request is rejected, so either credential works via
      either transport. Device tokens are rejected outside `/api/v1`.
      `GET .../events` additionally accepts a short-lived operator JWT as
      `?token=` for browser `EventSource`; device tokens are never accepted
      in a URL. Each v1 request must present exactly one of these credential
      transports; multiple transports return `400` rather than applying
      credential precedence. Prefer `Authorization` with streaming `fetch`. Open SSE
      sessions close at JWT expiry. API-token sessions revalidate revocation,
      scope, and any exact device/identity binding at most every 15 seconds;
      authorization-storage uncertainty also closes the stream. Resume with a
      current credential and the last durably applied cursor.

      `GET /api/v1/server_info` and `POST /api/v1/pair` are public.
      `POST /api/v1/pair/start` performs its own authenticated admin check.

paths:
  # ============================================================================
  # Authentication Endpoints
  # ============================================================================
  /auth/login:
    post:
      servers:
        - url: /
      tags: [Authentication]
      summary: User login
      description: |
        Authenticate with username/password and receive a JWT token. If the
        administrator password is missing or still the historical `admin123`
        setup sentinel, the server returns 409; complete `/api/setup_wizard`
        instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, client_id]
              additionalProperties: false
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  format: password
                  example: replace-with-operator-password
                client_id:
                  type: string
                  description: Unique client identifier
                  example: web-client-abc123
      responses:
        '200':
          description: Login successful
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  token:
                    type: string
                    description: JWT token
                  expires_in:
                    type: integer
                    description: Token expiry in seconds
                  username:
                    type: string
        '401':
          description: Invalid credentials
        '409':
          description: Initial setup has not established an administrator password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Request body must use the application/json media type.

  /auth/refresh:
    post:
      servers:
        - url: /
      tags: [Authentication]
      summary: Refresh JWT token
      description: Extend session by refreshing JWT token
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id]
              properties:
                client_id:
                  type: string
      responses:
        '200':
          description: Token refreshed
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  token:
                    type: string
                  expires_in:
                    type: integer
                  username:
                    type: string
        '415':
          description: Request body must use the application/json media type.

  /auth/verify:
    get:
      servers:
        - url: /
      tags: [Authentication]
      summary: Verify authentication
      description: Check if current authentication is valid
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Authentication valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  authenticated:
                    type: boolean
                  user:
                    type: object

  /auth/change_password:
    post:
      servers:
        - url: /
      tags: [Authentication]
      summary: Change admin password
      description: Change the admin password (requires authentication)
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
                  minLength: 8
                  description: |
                    New administrator password. After trimming surrounding
                    whitespace for policy checks it must contain at least
                    eight characters and cannot be the historical `admin123`
                    default.
      responses:
        '200':
          description: Password changed successfully
        '401':
          description: Current password incorrect
        '400':
          description: Invalid password format
        '415':
          description: Request body must use the application/json media type.

  /auth/tokens:
    get:
      tags: [Authentication]
      summary: List API tokens
      description: Get list of all API tokens (RESTful endpoint)
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: List of tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  tokens:
                    type: array
                    items:
                      type: object
                      required: [id, name, created_at, last_used, scope]
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                          description: |
                            Human-readable token name. Legacy stored
                            non-printing characters are returned as visible
                            `\uXXXX` or `\UXXXXXXXX` escapes.
                        created_at:
                          type: number
                          format: double
                          description: Unix epoch seconds.
                        last_used:
                          type: number
                          format: double
                          nullable: true
                          description: Unix epoch seconds, or null before first use.
                        scope:
                          type: string
                          description: Effective authorization scope; legacy null scopes render as admin.
        '401':
          description: Missing or invalid JWT/API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The authenticated API token does not have admin scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: API-token storage is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Authentication]
      summary: Create API token
      description: Generate a new API token (RESTful endpoint)
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: |
                    Friendly human-readable name for the token. The server
                    trims surrounding whitespace, rejects blank or
                    non-printing/control characters, and limits the input to
                    128 UTF-8 bytes.
                  example: "My API Token"
      responses:
        '200':
          description: Token created
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  token:
                    type: string
                    description: The plaintext token (only shown once)
                  token_id:
                    type: integer
                  name:
                    type: string
                  warning:
                    type: string
        '400':
          description: Invalid JSON body or token name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid JWT/API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The authenticated API token does not have admin scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: API-token storage is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Request body must use the application/json media type.

  /auth/tokens/{token_id}:
    delete:
      tags: [Authentication]
      summary: Revoke API token
      description: Delete/revoke an API token by ID (RESTful endpoint)
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: token_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 9223372036854775807
      responses:
        '200':
          description: Token revoked
        '404':
          description: Token not found
        '400':
          description: Token ID is outside the positive SQLite row-ID range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid JWT/API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The authenticated API token does not have admin scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: API-token storage is unavailable; revocation was not confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================================================================
  # System Endpoints
  # ============================================================================
  /stats:
    get:
      tags: [System]
      summary: Get system statistics
      description: Returns repeater uptime, packet counts, and version information
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  uptime_secs:
                    type: integer
                    example: 3600
                  packets_received:
                    type: integer
                    example: 150
                  packets_sent:
                    type: integer
                    example: 120
                  version:
                    type: string
                    example: "1.0.0"
                  core_version:
                    type: string
                    example: "0.5.0"

  /gps:
    get:
      tags: [GPS]
      summary: Get local GPS diagnostics
      description: Returns parsed NMEA fix, position, motion, accuracy, satellites, and raw sentence health.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: GPS diagnostics snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                      running:
                        type: boolean
                      status:
                        type: object
                      fix:
                        type: object
                      position:
                        type: object
                        description: Effective receiver position for API clients
                      gps_position:
                        type: object
                        description: Raw position reported by the GPS receiver, even before a valid fix
                      manual_position:
                        type: object
                        nullable: true
                        description: Configured repeater latitude/longitude, when set to a non-zero coordinate
                      position_meta:
                        type: object
                        properties:
                          source:
                            type: string
                            enum: [gps, manual_config]
                          source_label:
                            type: string
                          policy:
                            type: string
                            enum: [manual_until_gps_fix, gps_only]
                          manual_config_available:
                            type: boolean
                          gps_fix_valid:
                            type: boolean
                      motion:
                        type: object
                      accuracy:
                        type: object
                      time:
                        type: object
                      time_sync:
                        type: object
                        description: GPS-to-system-clock sync status
                        properties:
                          enabled:
                            type: boolean
                          state:
                            type: string
                            enum: [disabled, waiting_for_fix, waiting_for_time, ready, in_sync, synced, error, ignored]
                          last_attempt:
                            type: string
                            nullable: true
                          last_success:
                            type: string
                            nullable: true
                          last_error:
                            type: string
                            nullable: true
                          last_gps_time:
                            type: string
                            nullable: true
                          last_offset_seconds:
                            type: number
                            nullable: true
                      location_update:
                        type: object
                        description: GPS-fix-to-repeater-location update status
                        properties:
                          enabled:
                            type: boolean
                          state:
                            type: string
                            enum: [disabled, unconfigured, waiting_for_fix, waiting_for_position, ready, updated, skipped, error]
                          last_attempt:
                            type: string
                            nullable: true
                          last_success:
                            type: string
                            nullable: true
                          last_error:
                            type: string
                            nullable: true
                          last_latitude:
                            type: number
                            nullable: true
                          last_longitude:
                            type: number
                            nullable: true
                      satellites:
                        type: object
                      nmea:
                        type: object
                      raw_attributes:
                        type: object
                        additionalProperties: true

  /gps_stream:
    get:
      tags: [GPS]
      summary: GPS diagnostics SSE stream
      description: Server-Sent Events stream of live GPS diagnostics snapshots.
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string

  /send_advert:
    post:
      tags: [System]
      summary: Send repeater advertisement
      description: Manually trigger sending a repeater advertisement packet
      responses:
        '200':
          description: Advertisement sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '405':
          description: Method not allowed

  /logs:
    get:
      tags: [System]
      summary: Get system logs
      description: Retrieve recent system logs
      responses:
        '200':
          description: Log entries
          content:
            application/json:
              schema:
                type: object
                required: [logs]
                properties:
                  logs:
                    type: array
                    items:
                      type: object
                      required: [message, timestamp, level]
                      properties:
                        message:
                          type: string
                        timestamp:
                          type: string
                          format: date-time
                        level:
                          type: string
                  error:
                    type: string

  /logs_stream:
    get:
      tags: [System]
      summary: Stream system logs
      description: Server-Sent Events stream of live system log entries.
      parameters:
        - name: since_id
          in: query
          required: false
          schema:
            type: integer
          description: Resume the stream after this log entry id.
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string

  /hardware_stats:
    get:
      tags: [System]
      summary: Get hardware statistics
      description: CPU, memory, disk usage statistics
      responses:
        '200':
          description: Hardware stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  cpu_percent:
                    type: number
                  memory_percent:
                    type: number
                  disk_usage:
                    type: object

  /hardware_processes:
    get:
      tags: [System]
      summary: Get process information
      description: List running processes and their resource usage
      responses:
        '200':
          description: Process list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /restart_service:
    post:
      tags: [System]
      summary: Restart repeater service
      description: Restart the repeater daemon service
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Service restart initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /validate_config:
    get:
      tags: [System]
      summary: Validate config.yaml before restart
      description: Checks config syntax and required settings for the selected radio type.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Validation completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      valid:
                        type: boolean
                      blocked_restart:
                        type: boolean
                      errors:
                        type: array
                        items:
                          type: object
                          properties:
                            path:
                              type: string
                            message:
                              type: string
                      warnings:
                        type: array
                        items:
                          type: object
                          properties:
                            path:
                              type: string
                            message:
                              type: string
                      summary:
                        type: object
                        properties:
                          error_count:
                            type: integer
                          warning_count:
                            type: integer
                      config_path:
                        type: string
                      message:
                        type: string

  /openapi:
    get:
      tags: [System]
      summary: Get OpenAPI specification
      description: Returns the OpenAPI/Swagger specification for this API
      responses:
        '200':
          description: OpenAPI spec
          content:
            application/json:
              schema:
                type: object

  /set_mode:
    post:
      tags: [System]
      summary: Set repeater mode
      description: |
        Set TX mode. forward = repeat on; monitor = no repeat but companions/tenants can send;
        no_tx = all transmission disabled (receive-only).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [forward, monitor, no_tx]
                  description: |
                    - forward: Repeat received packets; allow all local TX (default)
                    - monitor: Do not repeat; allow local TX (companions, adverts, etc.)
                    - no_tx: Do not repeat; no local TX (receive-only)
                  example: forward
            examples:
              forward:
                value:
                  mode: forward
              monitor:
                value:
                  mode: monitor
              no_tx:
                value:
                  mode: no_tx
      responses:
        '200':
          description: Mode changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                success:
                  value:
                    success: true
                    data: "Mode set to forward"
        '400':
          description: Invalid mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /packet_stats:
    get:
      tags: [Packets]
      summary: Get packet statistics
      description: Returns packet counts, types, and routing statistics
      parameters:
        - name: hours
          in: query
          schema:
            type: integer
            default: 24
            minimum: 1
            maximum: 168
          description: Time range in hours (1-168 = 1 hour to 1 week)
          example: 24
      responses:
        '200':
          description: Packet statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      total_packets:
                        type: integer
                      received:
                        type: integer
                      transmitted:
                        type: integer
                      dropped:
                        type: integer
                      by_type:
                        type: object
                      by_route:
                        type: object

  /set_duty_cycle:
    post:
      tags: [System]
      summary: Set duty cycle
      description: Enable or disable duty cycle limiting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
                  description: Enable duty cycle limiting
                  example: true
            examples:
              enable:
                value:
                  enabled: true
              disable:
                value:
                  enabled: false
      responses:
        '200':
          description: Duty cycle setting updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /update_duty_cycle_config:
    post:
      tags: [System]
      summary: Update duty cycle configuration
      description: Update detailed duty cycle timing configuration
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                on_time:
                  type: integer
                  description: ON time in seconds
                off_time:
                  type: integer
                  description: OFF time in seconds
            example:
              enabled: true
              on_time: 300
              off_time: 60
      responses:
        '200':
          description: Duty cycle config updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /update_radio_config:
    post:
      tags: [System]
      summary: Update radio configuration
      description: Update LoRa radio parameters
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Radio config updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # ============================================================================
  # Packet Endpoints
  # ============================================================================
  /recent_packets:
    get:
      tags: [Packets]
      summary: Get recent packets
      description: Retrieve recent packet history
      parameters:
        - name: limit
          in: query
