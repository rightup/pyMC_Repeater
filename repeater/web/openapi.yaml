              required: [kind]
              properties:
                kind:
                  type: string
                  enum: [channel_hashes, pubkeys]
                group_id:
                  type: string
                friendly_name:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: Group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
    delete:
      tags: [Network Policy]
      summary: Delete policy group
      description: Delete a named group and all of its entries.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, group_id]
              properties:
                kind:
                  type: string
                  enum: [channel_hashes, pubkeys]
                group_id:
                  type: string
      responses:
        '200':
          description: Group deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /policy_group_entries:
    get:
      tags: [Network Policy]
      summary: List group entries
      description: Return entries for a specific named channel hash/pubkey group.
      security:
