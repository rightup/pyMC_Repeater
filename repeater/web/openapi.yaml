    LbtCorrelationValue:
      type: object
      required: [coefficient, sample_count]
      properties:
        coefficient:
          type: number
          format: float
          nullable: true
          description: Pearson coefficient in range [-1, 1] when enough samples exist
        sample_count:
          type: integer
          minimum: 0
        note:
          type: string
          nullable: true

    RoomMessage:
      type: object
      required: [id, author_pubkey, post_timestamp, message_text, txt_type]
      properties:
        id:
          type: integer
          description: Database message ID
          example: 123
        author_pubkey:
          type: string
          pattern: '^[0-9a-fA-F]{64}$|^00{64}$'
          description: |
            Author's public key (64 hex chars):
            - 32 zeros (64 '0's) = server/system message
            - Other hex = regular user message
          example: "abc123def456..."
        author_prefix:
          type: string
          pattern: '^[0-9a-fA-F]{8}$'
          description: First 8 chars of author_pubkey (for display)
          example: "abc123de"
        post_timestamp:
          type: number
          format: float
          description: Server timestamp when message was stored (Unix epoch)
          example: 1734567890.5
        sender_timestamp:
          type: integer
          description: Client-provided timestamp (may be inaccurate)
          example: 1734567890
        message_text:
          type: string
          maxLength: 160
          description: Message content (auto-truncated at 160 bytes)
          example: "Hello world"
        txt_type:
          type: integer
          enum: [0, 2]
          description: |
            Message type:
            - 0: Plain text
            - 2: Signed plain text
          example: 0
        created_at:
          type: number
          format: float
          description: Database insertion timestamp (Unix epoch)
          example: 1734567890.5

    RoomClient:
      type: object
      required: [pubkey, sync_since, unsynced_count, is_active]
      properties:
        pubkey:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
          description: Client's public key (64 hex chars)
          example: "abc123def456..."
        pubkey_prefix:
          type: string
          pattern: '^[0-9a-fA-F]{8}$'
          description: First 8 chars of pubkey (for display)
          example: "abc123de"
        sync_since:
          type: number
          format: float
          description: Last sync timestamp (Unix epoch)
          example: 1734567890.5
        unsynced_count:
          type: integer
          minimum: 0
          maximum: 32
          description: Number of new messages for this client (max 32, messages NOT sent to author)
          example: 5
        pending_ack:
          type: boolean
          description: Waiting for ACK from client
          example: false
        push_failures:
          type: integer
          minimum: 0
          description: Number of failed delivery attempts
          example: 0
        last_activity:
          type: number
          format: float
          description: Last activity timestamp (Unix epoch)
          example: 1734567890.5
        in_acl:
          type: boolean
          description: Client passes ACL check
          example: true
        is_active:
          type: boolean
          description: Client is currently active (synced within timeout period)
          example: true

    Identity:
      type: object
      required: [name, type, hash, public_key]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-zA-Z0-9_\-\s]+$'
          description: Identity name (alphanumeric, spaces, hyphens, underscores)
          example: "General Chat"
        type:
          type: string
          enum: [repeater, room_server]
          description: |
            - repeater: Repeater identity (only one allowed per system)
            - room_server: Room server for group chat
          example: room_server
        hash:
          type: string
          pattern: '^0x[0-9a-fA-F]{2}$'
          description: 1-byte identity hash (used in radio packets)
          example: "0x42"
        public_key:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
          description: Ed25519 public key (64 hex chars)
          example: "abc123def456..."
        settings:
          type: object
          description: Type-specific settings
          properties:
            admin_password:
              type: string
              minLength: 4
              description: Admin password (room_server only)
              example: "admin123"
            guest_password:
              type: string
              minLength: 4
              description: Guest password (room_server only)
              example: "guest123"
            max_posts:
              type: integer
              minimum: 1
              maximum: 32
              default: 32
              description: Maximum messages to keep (room_server only, hard limit 32)
              example: 32

    ACLClient:
      type: object
      required: [public_key, public_key_full, address, permissions]
      properties:
        public_key:
          type: string
          description: Truncated public key for display (first 24 and last 8 chars)
          example: "03ccf3bb0bed9a51...21416fff"
        public_key_full:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
          description: Full client public key (64 hex chars)
          example: "03ccf3bb0bed9a5109868a1e33ed020519aab6dbb30e42df3b11a21d21416fff"
        address:
          type: string
          description: Client address identifier
          example: "e1"
        permissions:
          type: string
          enum: [admin, guest, read_only]
          description: |
            Client permission level:
            - admin: Full access
            - guest: Limited access
            - read_only: Read-only access
          example: "admin"
        last_activity:
          type: integer
          description: Unix timestamp of last activity
          example: 1766065148
        last_login_success:
          type: integer
          description: Unix timestamp of last successful login
          example: 1766065146
        last_timestamp:
          type: integer
          description: Unix timestamp from last client message
          example: 1766065146
        identity_name:
          type: string
          description: Name of the identity this client is authenticated to
          example: "rrrrr"
        identity_type:
          type: string
          enum: [repeater, room_server]
          description: Type of identity
          example: "room_server"
        identity_hash:
          type: string
          pattern: '^0x[0-9a-fA-F]{2}$'
          description: Hash of the identity
          example: "0xC5"

    MobileCompanionSummary:
      type: object
      description: One entry from `GET /api/v1/companions` (scope-filtered).
      properties:
        name:
          type: string
          example: "field-radio-1"
        companion_hash:
          type: string
          pattern: '^0x[0-9a-f]{2}$'
          example: "0xa4"
        node_name:
          type: string
        public_key:
          type: string
          description: Full ed25519 public key, hex-encoded (64 chars).

    MobileSnapshot:
      type: object
      description: Bootstrap document returned by `GET .../snapshot`.
      properties:
        journal_epoch:
          type: string
          description: Opaque epoch id; changes if the journal is ever reset (e.g. DB restore).
        cursor:
          type: string
          description: Journal head `seq` at snapshot time, as a string. Feed this to `sync` as `cursor`.
        self:
          type: object
          properties:
            public_key:
              type: string
            node_name:
              type: string
            adv_type:
              type: integer
            latitude:
              type: number
            longitude:
              type: number
        contacts:
          type: array
          items:
            type: object
            properties:
              public_key:
                type: string
              name:
                type: string
              adv_type:
                type: integer
              flags:
                type: integer
                description: |
                  Raw flag bitfield; **bit 0 (`0x01`) marks a favourite**
                  (protected from forced-trim eviction). Other bits are in use.
              favorite:
                type: boolean
                description: Derived from `flags` bit 0.
              out_path_len:
                type: integer
              last_advert_timestamp:
                type: integer
              lastmod:
                type: integer
              gps_lat:
                type: number
              gps_lon:
                type: number
        channels:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              name:
                type: string
          description: PSK secrets are never exposed on this surface.
        messages:
          type: array
          description: Most recent messages (default/max 200 via `messages_limit`), oldest-first.
          items:
            $ref: '#/components/schemas/MobileMessage'
        server:
          type: object
          properties:
            time:
              type: number
            version:
              type: string
              nullable: true

    MobileMessage:
      type: object
      description: |
        A `companion_messages` row. `sender_key` and `channel_data_payload`
        are hex-encoded byte strings; `is_channel` distinguishes a channel
        post (`channel_idx` set) from a DM (`sender_key`/`sender_prefix` set).
      properties:
        id:
          type: integer
        companion_hash:
          type: string
        sender_key:
          type: string
        sender_prefix:
          type: string
        txt_type:
          type: integer
        timestamp:
          type: integer
        text:
          type: string
        is_channel:
          type: boolean
        channel_idx:
          type: integer
          nullable: true
        path_len:
          type: integer
        snr:
          type: number
        rssi:
          type: integer
        channel_data_type:
          type: integer
        channel_data_payload:
          type: string
        packet_hash:
          type: string
          nullable: true
        created_at:
          type: number
        consumed_at:
          type: number
          nullable: true

    MobileJournalEvent:
      type: object
      description: |
        One event, identical shape whether delivered via `sync`'s `events`
        array or one SSE frame's `data:` line (design doc §9). `data` is
        type-specific per `type` — clients must ignore unrecognized types.

        Known `type` values and their `data` shapes:
        - `message` — a persisted inbound/outbound message (`data` mirrors a
          `companion_messages` row).
        - `contact` — a contact upsert.
        - `channel` — a channel slot was added, renamed or cleared:
          `{index, name, change: "update"|"remove"}`. `name` is `null` when
          `change` is `"remove"`. The PSK secret is **never** included —
          the snapshot withholds it (§11.4) and a secret journaled here would
          reach every synced device *and* persist in the journal table.
          Emitted on a real change only: a rejected or no-op `SET_CHANNEL`
          produces nothing, and the bulk save at shutdown is not journaled
          (it would replay the whole table on every restart).
        - `prefs` — a bridge-preferences change. Note prefs are **observable
          but not settable** over `/api/v1`: the event reports changes made on
          any surface, but no v1 endpoint causes one.
        - `message_reception` — another RF copy of a known inbound message
          (§10.4): `{message_id, packet_hash, path[], rssi, snr, observed_at,
          observation_count, unique_path_count}`.
        - `message_send_state` — a heard-repeat of one of our sends (§10.3):
          `{message_id (null — outbound sends aren't persisted), state:
          "heard_repeated", packet_hash, path[], terminal_repeater_hash,
          rssi, snr, observed_at, heard_repeat_count, unique_repeater_count}`.
        - `rf_reception` — the opt-in firehose (§9): every OTA duplicate the
          repeater hears, regardless of companion relevance. **Off by
          default** — suppressed from `sync`/`events` output unless the caller
          passes `?include=rf_receptions` *and* the companion has the
          `rf_reception_events` setting enabled. `{packet_hash, rssi, snr,
          path[], observed_at}`. `path` here is raw hashes (not resolved).
      properties:
        seq:
          type: integer
        type:
          type: string
          enum: [message, contact, channel, prefs, message_reception, message_send_state, rf_reception]
          example: message
        ts:
          type: number
        packet_hash:
          type: string
          nullable: true
        data:
          type: object

    MobileActionResult:
      type: object
      description: |
        `data` for the contact-action endpoints (login/status_request/
        telemetry_request). This is the underlying `CompanionBridge` call's
        result object passed through `companion_endpoints._to_json_safe`
        (dataclass/enum -> plain JSON), so its exact fields depend on the
        companion bridge library version; treat it as an open object.

    ResolvedPathElement:
      type: object
      description: |
        One hop of an RF path (design doc §10.5). Path entries are abbreviated
        hashes (commonly one byte) that genuinely collide, so every rendered
        element carries both the raw value and its interpretation against the
        companion's current contacts. Clients display `raw_hash` unless
        `resolution` is `unique`. Resolution is computed at read time, so it
        can improve as contacts are learned.
      properties:
        raw_hash:
          description: The raw path element as stored (opaque; usually a short hex string).
        resolution:
          type: string
          enum: [unique, ambiguous, unknown]
          description: |
            `unique` = exactly one contact prefix-matches; `ambiguous` = more
            than one; `unknown` = none (or a blank element).
        candidates:
          type: array
          description: Prefix-matching contacts, capped at 5.
          items:
            type: object
            properties:
              pubkey:
                type: string
                description: Full contact public key, lowercase hex.
              name:
                type: string
        truncated:
          type: boolean
          description: Present and true only when more than 5 contacts matched and `candidates` was capped.

    RfReception:
      type: object
      description: One RF copy of a message's `packet_hash` (design doc §10).
      properties:
        observed_at:
          type: number
          description: Arrival timestamp, epoch seconds.
        rssi:
          type: number
          nullable: true
        snr:
          type: number
          nullable: true
        path:
          type: array
          description: Incoming path, each hop resolved (§10.5).
          items:
            $ref: '#/components/schemas/ResolvedPathElement'
        is_duplicate:
          type: boolean
        transmitted:
          type: boolean
          description: True if this row is one we retransmitted.

    RfPathAggregate:
      type: object
      description: One distinct incoming path for a contact, with signal stats (§10).
      properties:
        path:
          type: array
          items:
            $ref: '#/components/schemas/ResolvedPathElement'
        count:
          type: integer
          description: Copies observed over this exact path in the window.
        first_seen:
          type: number
        last_seen:
          type: number
        rssi_min:
          type: number
          nullable: true
        rssi_max:
          type: number
          nullable: true
        rssi_avg:
          type: number
          nullable: true
        snr_min:
          type: number
          nullable: true
        snr_max:
          type: number
          nullable: true
        snr_avg:
          type: number
          nullable: true
        first_hop:
          allOf:
            - $ref: '#/components/schemas/ResolvedPathElement'
          nullable: true
          description: Convenience alias for `path[0]`, null for an empty path.
        last_hop:
          allOf:
            - $ref: '#/components/schemas/ResolvedPathElement'
          nullable: true
          description: Convenience alias for `path[-1]`, null for an empty path.

    RfHeardRepeat:
      type: object
      description: One heard repeat of our transmission (design doc §10.3).
      properties:
        observed_at:
          type: number
        rssi:
          type: number
          nullable: true
        snr:
          type: number
          nullable: true
        path:
          type: array
          items:
            $ref: '#/components/schemas/ResolvedPathElement'
        terminal_repeater:
          allOf:
            - $ref: '#/components/schemas/ResolvedPathElement'
          nullable: true
          description: |
            The last path hop — the repeater that forwarded this copy to us
            (§10.3). Null for an empty path.

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token authentication via the `Authorization: Bearer` header
        (web UI / `admin` scope). Also accepts a Mobile Companion API v1
        (`/api/v1/*`) device token minted by `POST /api/v1/pair`: the auth
        code (`repeater/web/auth/middleware.py`, `repeater/web/auth/
        cherrypy_tool.py`) tries the Bearer value as a JWT first, and falls
        back to a device-token lookup only if JWT verification fails, so a
        device token works equally well as `Authorization: Bearer <token>`
        or `X-API-Key: <token>` (see `ApiKeyAuth`).
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        API key authentication for machine-to-machine access, and the
        original transport for Mobile Companion API v1 (`/api/v1/*`) device
        tokens minted by `POST /api/v1/pair`. `Authorization: Bearer` now
        also accepts these tokens (see `BearerAuth`), matching
        `docs/architecture/mobile-companion-api.md`. Each token carries a
        `scope` recorded at mint time and enforced by
        `CompanionsV1._check_scope`: `admin` (full access, implied for all
        pre-scope-migration tokens), `companion:*` (all companion
        identities), or `companion:{name}` (exactly the one companion
        identity the token was paired to). A `scope`-less `request.user`
        (legacy caller) is treated as `admin`.

# Future security - currently open
# security:
