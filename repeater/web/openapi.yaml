          schema:
            type: string
          description: Upstream peer hash to query.
        - name: path_hash_size
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 3
          description: Path hash size in bytes for the peer hash.
        - name: hours
          in: query
          required: false
          schema:
            type: integer
            default: 24
            minimum: 1
            maximum: 168
          description: Time window in hours.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 1000
            minimum: 1
            maximum: 5000
          description: Maximum rows to return.
      responses:
        '200':
          description: Neighbour link history
          content:
            application/json:
