  /v1/companions/{name}/messages/{id}/receptions:
    get:
      tags: [Mobile Companion API v1]
      summary: Bounded RF receptions of a message's packet_hash
      description: |
        RF observation surface (architecture §12). Returns up to 500
        receptions of the message's `packet_hash` within the window —
        per-copy RSSI/SNR, the incoming path (each element resolved against
        the companion's contacts), arrival time, and whether we retransmitted
        it. `truncated` says more matched.

        The window is measured back from *now*, not anchored on the message's
        own timestamp — a message can be heard again well after it first
        arrived — so a copy that predates the message but falls inside the
        window is included. The query resolves through `idx_packets_hash`
        with the bounded window; `observation_count`/`unique_path_count`
        describe the returned rows (the full result only when `truncated` is
        false), not the approximate running counters on the message row. A message
        with no `packet_hash` (predates correlation) returns an empty
        `receptions` list rather than a 404.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/CompanionRegistrationName'
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 9223372036854775807
          description: The `companion_messages` row id.
        - name: window
          in: query
          required: false
          schema:
            type: string
            default: 24h
          description: |
            Look-back window, back from now. Bare integer seconds or an
            integer with an `s`/`m`/`h`/`d` suffix (e.g. `30m`, `24h`, `7d`).
            Clamped to `[60s, 7d]` (default `24h`); a malformed string is a
            `400`.
      responses:
        '200':
          description: Receptions (possibly empty)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required:
                          - message_id
                          - packet_hash
                          - window
                          - receptions
                          - observation_count
                          - unique_path_count
                          - truncated
                          - observations_pruned
                        properties:
                          message_id:
                            type: integer
                          packet_hash:
                            type: string
                            nullable: true
                            description: 16-char (64-bit) correlation key, or null if the message has none.
                          window:
                            type: integer
                            description: Effective (clamped) window in seconds.
                          receptions:
                            type: array
                            items:
                              $ref: '#/components/schemas/RfReception'
                          observation_count:
                            type: integer
                          unique_path_count:
                            type: integer
                          truncated:
                            type: boolean
                            description: True when more than 500 receptions matched; counts describe returned rows.
                          observations_pruned:
                            type: boolean
                            description: True when the window reaches past the packets retention floor.
        '400':
          description: |
            `Invalid message id` or `Invalid window`. Rendered as the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '401':
          description: Missing/invalid JWT or API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '404':
          description: |
            Companion or message not found — also returned for companions
            outside the caller's token scope (identical status and message).
            Rendered as the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '503':
          $ref: '#/components/responses/ServiceUnavailableV1'

  /v1/companions/{name}/contacts/{pubkey}/paths:
    get:
      tags: [Mobile Companion API v1]
      summary: Incoming path aggregation for a contact
      description: |
        RF observation surface (architecture §12). Aggregates distinct incoming
        paths seen on a contact's traffic within the window, each with a copy
        count, first/last-seen timestamps, and RSSI/SNR min/max/avg — a
        "route diversity" view. Paths are ordered most-observed first.

        Resolution is by `companion_messages.sender_key`, so the contact does
        not need to exist in `companion_contacts` to be queried. The contact's
        recent `packet_hash`es are resolved first (bounded to
        `message_limit` messages, reported as `messages_scanned`), then a
        hash-keyed `idx_packets_hash` lookup per packet — never a scan of
        `packets` on a non-indexed column. Observation rows are capped at 500;
        each path element is resolved against the companion's contacts.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/CompanionRegistrationName'
        - name: pubkey
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{64}$'
        - name: window
          in: query
          required: false
          schema:
            type: string
            default: 24h
          description: |
            Look-back window, back from now. Same format/clamps as the
            receptions endpoint (`[60s, 7d]`, default `24h`).
      responses:
        '200':
          description: Path aggregation (possibly empty)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required:
                          - contact_pubkey
                          - window
                          - paths
                          - total_observations
                          - messages_scanned
                          - message_limit
                          - observation_limit
                          - truncated
                          - observations_pruned
                        properties:
                          contact_pubkey:
                            type: string
                            description: Lowercase hex, echoed from the path param.
                          window:
                            type: integer
                          paths:
                            type: array
                            items:
                              $ref: '#/components/schemas/RfPathAggregate'
                          total_observations:
                            type: integer
                          messages_scanned:
                            type: integer
                            description: Number of the contact's messages resolved for hashes (bounded).
                          message_limit:
                            type: integer
                            description: The cap on `messages_scanned` (200).
                          observation_limit:
                            type: integer
                            description: The cap on packet observations (500).
                          truncated:
                            type: boolean
                            description: True when either the message or observation cap omitted matching rows; counts describe returned rows.
                          observations_pruned:
                            type: boolean
        '400':
          description: |
            Invalid public key or `Invalid window`. Rendered as the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '401':
          description: Missing/invalid JWT or API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '404':
          description: |
            Companion not found — also returned for companions outside the
            caller's token scope (identical status and message). Rendered as
            the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '503':
          $ref: '#/components/responses/ServiceUnavailableV1'

  /v1/companions/{name}/transmissions/{packet_hash}/repeats:
    get:
      tags: [Mobile Companion API v1]
      summary: Heard repeats of our own transmission
      description: |
        RF observation surface. The hash must first resolve to a durable
        outbound message owned by this companion; global packet rows alone
        do not establish authorization. It then returns receptions of that
        same hash arriving
        *after* our transmit — neighbors repeating us. The strongest
        available signal that a send actually propagated.

        Predicate is exactly `is_duplicate=1 AND transmitted=0 AND
        timestamp > tx.timestamp` (local echo and the transmit row itself are
        excluded). At most 500 matching rows are returned. Two counts are
        exposed and neither is collapsed into the
        other: `heard_repeat_count` (every matching OTA copy — a repeater
        heard twice counts twice) and `unique_repeater_count` (distinct
        terminal path hashes, i.e. the last hop each copy took). When
        `truncated` is true, both describe only the returned rows. They are
        always a lower bound because hash-changing rebroadcast variants are
        out of scope. `packet_hash` accepts exactly 16 or 64 hexadecimal characters,
        with an optional `0x` prefix.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/CompanionRegistrationName'
        - name: packet_hash
          in: path
          required: true
          schema:
            type: string
            pattern: '^(0x)?([0-9A-Fa-f]{16}|[0-9A-Fa-f]{64})$'
          description: The companion-owned transmission correlation key.
        - name: window
          in: query
          required: false
          schema:
            type: string
            default: 24h
          description: |
            Look-back window for locating the transmit row, back from now.
            Same format/clamps as the receptions endpoint (`[60s, 7d]`,
            default `24h`). Repeats are then searched from the
            transmit time forward.
      responses:
        '200':
          description: Heard repeats (possibly empty)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required:
                          - packet_hash
                          - transmitted_at
                          - window
                          - repeats
                          - heard_repeat_count
                          - unique_repeater_count
                          - truncated
                          - observations_pruned
                        properties:
                          packet_hash:
                            type: string
                            description: 16-char correlation key.
                          transmitted_at:
                            type: number
                            description: Earliest matching transmit timestamp (epoch seconds).
                          window:
                            type: integer
                          repeats:
                            type: array
                            items:
                              $ref: '#/components/schemas/RfHeardRepeat'
                          heard_repeat_count:
                            type: integer
                          unique_repeater_count:
                            type: integer
                          truncated:
                            type: boolean
                            description: True when more than 500 heard repeats matched; counts describe returned rows.
                          observations_pruned:
                            type: boolean
        '400':
          description: |
            `Invalid packet_hash` or `Invalid window`. Rendered as the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '401':
          description: Missing/invalid JWT or API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '404':
          description: |
            Companion not found, or no transmission of this `packet_hash` in
            the window — also returned for companions outside the caller's
            token scope (identical status and message). Rendered as the v1
            JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '503':
          $ref: '#/components/responses/ServiceUnavailableV1'

components:
  schemas:
    LegacyCompanionHash:
      description: |
        Optional legacy companion selector. Prefer `companion_name`; this
        hash form exists for upstream Repeater API compatibility.
      oneOf:
        - type: integer
          minimum: 0
          maximum: 255
        - type: string
          pattern: '^(?:0[xX][0-9A-Fa-f]{1,2}|(?:0|[1-9][0-9]{0,2}))$'

    LegacyPublicKey:
      type: string
      pattern: '^[0-9A-Fa-f]{64}$'
      description: Exactly one 32-byte public key encoded as 64 hexadecimal characters.

    LegacyTimeout:
      type: number
      minimum: 1
      maximum: 60
      description: Request timeout in seconds. Use a JSON number; numeric strings remain compatibility-only.

    CompanionRegistrationName:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
      description: |
        Stable companion registration slug used in configuration, URL path
        segments, pairing, and authorization scopes. Human-facing text belongs
        in `node_name`.
      example: "my-companion"

    SuccessResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          description: Response data (varies by endpoint)

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: Error message

    ErrorResponseV1:
      description: |
        Error envelope for the Mobile Companion API v1 tree (`/api/v1/*`).
        Every 4xx/5xx error under `/v1/*` — auth failures (401), scope
        rejections (403), not-found (404), validation errors (400/422), and
        uncaught exceptions (500) alike — renders this same JSON shape
        instead of CherryPy's default HTML error page
        (`repeater/web/http_server.py`'s `error_page.401` handler and the
        `/api/v1` `error_page.default` handler registered alongside it).
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            status:
              type: integer
              description: HTTP status code, included by error paths that echo it.
              example: 401

