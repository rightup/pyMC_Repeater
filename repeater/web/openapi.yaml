  /companion/events:
    get:
      tags: [System]
      summary: Stream companion events (SSE)
      description: |
        Legacy operator event stream. Prefer `Authorization: Bearer`; browser
        `EventSource` may use an exact `?token=` query parameter containing a
        short-lived operator JWT. Device/API tokens are never accepted in the
        query string. This route and `/v1/.../events` share one process-wide
        `mobile_api.sse_max_connections` budget and one-stream-per-principal/
        companion rule. Two HTTP workers are always reserved for ordinary
        APIs. The configured connection cap may not exceed 256. The queue is
        clamped to at least 32 and capped at 4096; keepalive is clamped to at
        least 5 seconds and capped at 60 seconds. The
        stream closes at JWT expiry or within 15 seconds of API-token
        revocation/scope change; authorization-storage uncertainty also
        closes it.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/LegacyCompanionNameQuery'
        - $ref: '#/components/parameters/LegacyCompanionHashQuery'
        - name: token
          in: query
          required: false
          schema:
            type: string
          description: |
            Operator JWT only, for browser `EventSource`. Prefer
            `Authorization`; never put a device token in a URL.
      responses:
        '200':
          description: Event stream
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store, no-cache, no-transform
          content:
            text/event-stream:
              schema:
                type: string
        '429':
          description: Shared SSE connection budget or duplicate stream limit reached.
          headers:
            Retry-After:
              schema:
                type: integer
                example: 5

