  /needs_setup:
    get:
      tags: [System]
      summary: Check setup wizard status
      description: |
        Public, read-only first-run discovery. `needs_setup` describes whether
        the node name, administrator password, or radio still needs operator
        attention. It is intentionally independent of
        `public_bootstrap_allowed`, which is the authoritative permission for
        unauthenticated setup/import mutation.

        Public bootstrap closes when `repeater.setup_complete` is true or a
        non-empty, non-default administrator password is already configured.
        Successful setup and configuration import set `setup_complete: true`;
        imports cannot clear that marker.
      security: []
      responses:
        '200':
          description: Setup status
          content:
            application/json:
              schema:
                type: object
                required: [needs_setup, public_bootstrap_allowed]
                additionalProperties: false
                properties:
                  needs_setup:
                    type: boolean
                  public_bootstrap_allowed:
                    type: boolean
                    description: |
                      Whether unauthenticated `POST /setup_wizard` and
                      `POST /config_import` mutation is currently allowed.
                  reasons:
                    type: object
                    required:
                      [default_name, default_password, radio_not_configured]
                    additionalProperties: false
                    properties:
                      default_name:
                        type: boolean
                      default_password:
                        type: boolean
                      radio_not_configured:
                        type: boolean
                  error:
                    type: string
                    description: Present only when status inspection failed.

