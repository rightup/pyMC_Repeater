  # ============================================================================
  # Identity Management
  # ============================================================================
  /create_identity:
    post:
      tags: [Identities]
      summary: Create new identity
      description: |
        Create a new companion or room server identity.
        A companion `name` is its stable URL/configuration slug; put the
        human-facing name in `settings.node_name`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: |
                    Identity registration name. For `companion`, this must
                    match `^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$`; it is the
                    stable slug used in configuration, URLs, and scopes.
                    `room_server` retains the upstream human-readable naming
                    rules (alphanumeric, spaces, hyphens, and underscores).
                  example: "my-companion"
                identity_key:
                  type: string
                  pattern: '^(?:[0-9a-fA-F]{64}|[0-9a-fA-F]{128})$'
                  description: 32- or 64-byte hex key (64 or 128 chars). Omit for auto-generation
                  example: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
                type:
                  type: string
                  enum: [companion, room_server]
                  description: |
                    - companion: Companion identity with a TCP endpoint
                    - room_server: Room server for group chat
                  example: room_server
                settings:
                  type: object
                  description: Type-specific settings
                  properties:
                    admin_password:
                      type: string
                      minLength: 4
                      description: Admin authentication password (room_server only)
                      example: "replace-with-room-admin-password"
                    guest_password:
                      type: string
                      minLength: 4
                      description: Guest authentication password (room_server only)
                      example: "replace-with-room-guest-password"
                    max_posts:
                      type: integer
                      minimum: 1
                      maximum: 32
                      default: 32
                      description: Maximum messages to keep (hard limit 32)
                      example: 32
                    node_name:
                      type: string
                      description: |
                        Human-facing advertised name (companion only; defaults
                        to the registration slug). Maximum 31 bytes of UTF-8;
                        CR, LF, and NUL are rejected.
                      example: "My Companion"
                    frame_enabled:
                      type: boolean
                      default: true
                      description: |
                        Whether to start the upstream-compatible TCP frame
                        listener (companion only). Set false for a REST/SSE-only
                        companion; the bridge and shared radio path remain active.
                    tcp_port:
                      type: integer
                      minimum: 1
                      maximum: 65535
                      default: 5000
                      description: TCP listener port (companion only)
                      example: 5000
                    tcp_timeout:
                      type: integer
                      minimum: 0
                      maximum: 2147483647
                      default: 28800
                      description: |
                        Frame-client idle timeout in seconds (companion only).
                        `0` disables the idle timeout.
                      example: 28800
                    bind_address:
                      type: string
                      default: "127.0.0.1"
                      description: |
                        TCP listener bind address (companion only). The frame
                        protocol is unauthenticated and can expose identity and
                        channel secrets; keep loopback unless the network is
                        explicitly trusted.
                      example: "127.0.0.1"
                    adopt_legacy_namespace:
                      type: boolean
                      default: false
                      description: |
                        One-time companion recovery setting. Set true only
                        after verifying that unbound rows from an older build
                        belong to this full public identity. It can create a
                        missing binding but never replace an existing one.
                    max_contacts:
                      type: integer
                      minimum: 1
                      default: 1000
                      description: Maximum durable contacts for this companion.
                    offline_queue_size:
                      type: integer
                      minimum: 0
                      maximum: 4096
                      default: 512
                      description: |
                        Bounded pending queue for frame delivery. `0` disables
                        offline frame queuing; REST history remains durable.
                    trim_contacts_on_overflow:
                      type: boolean
                      default: false
                      description: |
                        On startup, remove the oldest non-favourite contacts
                        when persisted contacts exceed `max_contacts`.
                    rf_reception_events:
                      type: boolean
                      default: false
                      description: |
                        Include high-volume uncorrelated RF reception events in
                        this companion's journal. Leave off for normal chat.
              oneOf:
                - title: Companion identity
                  properties:
                    type:
                      type: string
                      enum: [companion]
                    name:
                      $ref: '#/components/schemas/CompanionRegistrationName'
                - title: Room server identity
                  properties:
                    type:
                      type: string
                      enum: [room_server]
                    name:
                      type: string
                      minLength: 1
                      maxLength: 64
                      pattern: '^[a-zA-Z0-9_\-\s]+$'
            examples:
              room_server:
                value:
                  name: "General Chat"
                  type: room_server
                  settings:
                    admin_password: "replace-with-room-admin-password"
                    guest_password: "replace-with-room-guest-password"
                    max_posts: 32
              companion:
                value:
                  name: "my-companion"
                  type: companion
                  identity_key: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
                  settings:
                    node_name: "My Companion"
                    frame_enabled: true
                    tcp_port: 5000
                    bind_address: "127.0.0.1"
      responses:
        '200':
          description: Identity created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      name:
                        type: string
                      type:
                        type: string
                      hash:
                        type: string
                      public_key:
                        type: string
                      activation_pending:
                        type: boolean
                        description: |
                          Companion only. True when the initial live activation
                          exceeded the request wait but is still completing in
                          the background. Poll `GET /identity?name=...` for
                          `registered: true`; restart only if it does not
                          complete.
              examples:
                success:
                  value:
                    success: true
                    data:
                      name: "General Chat"
                      type: room_server
                      hash: "0x42"
                      public_key: "abc123..."
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /identities:
    get:
      tags: [Identities]
      summary: List all identities
      description: |
        Returns configured room servers and companions plus runtime registration info.
        Companion entries with missing or blank registration names are assigned a stable
        `companion_<pubkeyPrefix>` name derived from the identity key and persisted when possible.
      responses:
        '200':
          description: List of identities
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required:
                          - registered
                          - configured
                          - configured_companions
                          - total_registered
                          - total_configured
                          - total_configured_companions
                        properties:
                          registered:
                            type: array
                            description: Live identities currently registered with the identity manager.
                            items:
                              $ref: '#/components/schemas/RegisteredIdentity'
                          configured:
                            type: array
                            description: Configured room-server identities.
                            items:
                              $ref: '#/components/schemas/Identity'
                          configured_companions:
                            type: array
                            description: Configured companion identities.
                            items:
                              $ref: '#/components/schemas/Identity'
                          total_registered:
                            type: integer
                            minimum: 0
                          total_configured:
                            type: integer
                            minimum: 0
                          total_configured_companions:
                            type: integer
                            minimum: 0

  /identity:
    get:
      tags: [Identities]
      summary: Get specific identity
      description: Retrieve details of a specific identity by name
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
          description: Identity name to retrieve
      responses:
        '200':
          description: Identity details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Identity'

  /update_identity:
    put:
      tags: [Identities]
      summary: Update identity
      description: |
        Modify an existing identity's configuration.
        For `room_server`, `name` is required to locate the identity.
        For `companion`, provide `name` OR `lookup_identity_key` OR `public_key_prefix`
        (at least 8 hex characters for prefix lookups) when the registration name is unknown.
        `lookup_identity_key` is retained only for compatibility; prefer the
        non-secret `public_key_prefix`.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: [room_server, companion]
                  default: room_server
                name:
                  type: string
                  maxLength: 64
                  description: |
                    Current identity registration name (required for
                    `room_server`; optional for `companion` if lookup fields
                    are set). A companion name is the stable ASCII slug
                    `^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$`.
                lookup_identity_key:
                  type: string
                  deprecated: true
                  description: |
                    Legacy companion lookup using private identity-key material.
                    Avoid transmitting identity secrets; use the non-secret
                    `public_key_prefix` when `name` is omitted.
                public_key_prefix:
                  type: string
                  description: |
                    Companion only: ed25519 public key hex prefix (min 8 hex chars) to locate the companion when `name` is omitted.
                new_name:
                  type: string
                  maxLength: 64
                  description: |
                    New identity registration name. For `companion`, this must
                    match `^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$`; change
                    `settings.node_name` instead when only the displayed name
                    should change.
                identity_key:
                  type: string
                  description: |
                    New identity key for a room server. Companion identity keys
                    are immutable because their durable state and paired
                    devices are identity-bound; create a new companion instead.
                force_trim:
                  type: boolean
                  default: false
                  description: |
                    Companion-only compatibility alias for setting
                    `trim_contacts_on_overflow: true`. It never deletes from a
                    live bridge. The response reports `trim_scheduled_count`;
                    favourite-safe removals run durably before activation on
                    restart.
                settings:
                  type: object
                  description: |
                    Updated settings. Room-server passwords are write-only:
                    omit them or send an empty string to keep the stored value,
                    and use the matching explicit `clear_*` boolean to remove
                    one. Public `*_configured` markers from an identity GET
                    may be round-tripped; the server ignores and never stores
                    them.
                  properties:
                    admin_password:
                      type: string
                      writeOnly: true
                      description: |
                        Room server only. A non-empty value replaces the stored
                        admin password; an omitted or empty value leaves it
                        unchanged.
                    guest_password:
                      type: string
                      writeOnly: true
                      description: |
                        Room server only. A non-empty value replaces the stored
                        guest password; an omitted or empty value leaves it
                        unchanged.
                    clear_admin_password:
                      type: boolean
                      writeOnly: true
                      default: false
                      description: |
                        Room server only. Explicitly remove the stored admin
                        password. Do not combine `true` with a non-empty
                        `admin_password`.
                    clear_guest_password:
                      type: boolean
                      writeOnly: true
                      default: false
                      description: |
                        Room server only. Explicitly remove the stored guest
                        password. Do not combine `true` with a non-empty
                        `guest_password`.
                    node_name:
                      type: string
                      description: Human-facing companion name; maximum 31 bytes of UTF-8.
                    frame_enabled:
                      type: boolean
                      default: true
                      description: |
                        Start the companion TCP frame listener. Set false for a
                        REST/SSE-only companion; no frame port is reserved.
                    tcp_port:
                      type: integer
                      minimum: 1
                      maximum: 65535
                      default: 5000
                    tcp_timeout:
                      type: integer
                      minimum: 0
                      maximum: 2147483647
                      default: 28800
                      description: Frame-client idle timeout in seconds; `0` disables it.
                    bind_address:
                      type: string
                      default: "127.0.0.1"
                      description: |
                        Frame listener bind. Loopback is the safe default
                        because this protocol has no application authentication.
                    adopt_legacy_namespace:
                      type: boolean
                      default: false
                      description: |
                        One-time companion recovery setting. Claims verified
                        unbound legacy rows for this full public identity; it
                        never replaces an existing namespace binding.
                    max_contacts:
                      type: integer
                      minimum: 1
                      default: 1000
                      description: Maximum durable contacts for this companion.
                    offline_queue_size:
                      type: integer
                      minimum: 0
                      maximum: 4096
                      default: 512
                      description: |
                        Bounded pending queue for frame delivery. `0` disables
                        offline frame queuing; REST history remains durable.
                    trim_contacts_on_overflow:
                      type: boolean
                      default: false
                      description: |
                        Trim oldest non-favourite contacts on startup when the
                        persisted count exceeds `max_contacts`.
                    rf_reception_events:
                      type: boolean
                      default: false
                      description: |
                        Include high-volume uncorrelated RF reception events in
                        this companion's journal.
              oneOf:
                - title: Companion identity update
                  required: [type]
                  not:
                    required: [identity_key]
                  properties:
                    type:
                      type: string
                      enum: [companion]
                    name:
                      $ref: '#/components/schemas/CompanionRegistrationName'
                    new_name:
                      $ref: '#/components/schemas/CompanionRegistrationName'
                - title: Room server identity update
                  properties:
                    type:
                      type: string
                      enum: [room_server]
                    name:
                      type: string
                      minLength: 1
                      maxLength: 64
                      pattern: '^[a-zA-Z0-9_\-\s]+$'
                    new_name:
                      type: string
                      minLength: 1
                      maxLength: 64
                      pattern: '^[a-zA-Z0-9_\-\s]+$'
      responses:
        '200':
          description: Identity updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /delete_identity:
    delete:
      tags: [Identities]
      summary: Delete identity
      description: |
        Remove an identity from the system.
        For `room_server`, `name` is required.
        For `companion`, provide `name` OR `public_key_prefix` (at least 8
        hex characters).
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Identity registration name to delete (required for room_server)
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [room_server, companion]
          description: Identity kind (default room_server)
        - name: public_key_prefix
          in: query
          required: false
          schema:
            type: string
          description: |
            Companion only: public key hex prefix (min 8 hex chars) when `name` is omitted.
      responses:
        '200':
          description: Identity deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /send_room_server_advert:
    post:
      tags: [Identities]
      summary: Send room server advertisement
      description: Broadcast a room server advertisement packet
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: Room server identity name
                node_name:
                  type: string
                  description: Node name for the advertisement
                latitude:
                  type: number
                  format: float
                  description: GPS latitude
                  example: 0.0
                longitude:
                  type: number
                  format: float
                  description: GPS longitude
                  example: 0.0
                disable_fwd:
                  type: boolean
                  description: Disable forwarding flag
                  default: false
      responses:
        '200':
          description: Advertisement sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # ============================================================================
  # ACL (Access Control List)
  # ============================================================================
  /acl_info:
    get:
      tags: [ACL]
      summary: Get ACL information for all identities
      description: |
        Get ACL configuration and statistics for all registered identities.

        Returns information including:
        - Identity name, type, and hash
        - Max clients allowed
        - Number of authenticated clients
        - Password configuration status
        - Read-only access setting
      responses:
        '200':
          description: ACL information for all identities
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      acls:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              example: "repeater"
                            type:
                              type: string
                              enum: [repeater, room_server]
                              example: "repeater"
                            hash:
                              type: string
                              pattern: '^0x[0-9a-fA-F]{2}$'
                              example: "0x42"
                            max_clients:
                              type: integer
                              example: 100
                            authenticated_clients:
                              type: integer
                              example: 5
                            has_admin_password:
                              type: boolean
                              example: true
                            has_guest_password:
                              type: boolean
                              example: true
                            allow_read_only:
                              type: boolean
                              example: true
                      total_identities:
                        type: integer
                        example: 3
                      total_authenticated_clients:
                        type: integer
                        example: 15

  /acl_clients:
    get:
      tags: [ACL]
      summary: List ACL clients
      description: Get list of authenticated clients in access control list for an identity
      parameters:
        - name: identity_hash
          in: query
          schema:
            type: string
            pattern: '^0x[0-9a-fA-F]{2}$'
          description: Identity hash
          example: "0x42"
        - name: identity_name
          in: query
          schema:
            type: string
          description: Identity name
          example: "General"
      responses:
        '200':
          description: ACL clients list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      clients:
                        type: array
                        items:
                          $ref: '#/components/schemas/ACLClient'
                      count:
                        type: integer
                        description: Number of clients returned
                      filter:
                        type: string
                        nullable: true
                        description: Filter applied (if any)
              examples:
                success:
                  value:
                    success: true
                    data:
                      clients:
                        - public_key: "03ccf3bb0bed9a51...21416fff"
                          public_key_full: "03ccf3bb0bed9a5109868a1e33ed020519aab6dbb30e42df3b11a21d21416fff"
                          address: "e1"
                          permissions: "admin"
                          last_activity: 1766065148
                          last_login_success: 1766065146
