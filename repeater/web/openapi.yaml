                        properties:
                          imported:
                            type: integer
                            minimum: 0
                            description: Filtered repeater adverts considered by this import.
                          added:
                            type: integer
                            minimum: 0
                            description: New durable companion contacts added.
                          updated:
                            type: integer
                            minimum: 0
                            description: Existing contacts whose advert-owned fields changed.
                          retained:
                            type: integer
                            minimum: 0
                            description: Existing contacts already matching the imported advert.
                          removed:
                            type: integer
                            minimum: 0
                            description: Non-favourite rows excluded by the companion contact limit.

