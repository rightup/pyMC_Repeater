  # ============================================================================
  # Transport Keys
  # ============================================================================
  /transport_keys:
    get:
      tags: [Transport Keys]
      summary: List transport keys
      description: Get list of all transport encryption keys
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: List of transport keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
    post:
      tags: [Transport Keys]
      summary: Create transport key
      description: Generate a new transport encryption key
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Key name/identifier
      responses:
        '200':
          description: Key created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /transport_key:
    get:
      tags: [Transport Keys]
      summary: Get transport key
      description: Retrieve specific transport key details
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: key_id
          in: query
          required: true
          schema:
            type: string
          description: Key ID to retrieve
      responses:
        '200':
          description: Key details
          content:
            application/json:
              schema:
                type: object
    put:
      tags: [Transport Keys]
      summary: Update transport key
      description: Update an existing transport encryption key
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: key_id
          in: query
          required: true
          schema:
            type: string
          description: Key ID to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Updated key name
                flood_policy:
                  type: string
                  enum: [allow, deny]
                  description: Updated flood policy
                transport_key:
                  type: string
                  description: Updated transport key hex
                parent_id:
                  type: integer
                  nullable: true
                  description: Updated parent transport key ID
                last_used:
                  type: string
                  format: date-time
                  description: Updated last-used timestamp in ISO-8601 format
      responses:
        '200':
          description: Key updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
    delete:
      tags: [Transport Keys]
      summary: Delete transport key
      description: Remove a transport encryption key
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: key_id
          in: query
          required: true
          schema:
            type: string
          description: Key ID to delete
      responses:
        '200':
          description: Key deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

