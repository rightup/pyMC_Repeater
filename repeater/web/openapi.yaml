                  description: Empty or omitted means all supported advert types.
                hours:
                  type: integer
                  minimum: 1
                  maximum: 876000
                  description: Only import adverts heard within this many hours.
                limit:
                  type: integer
                  minimum: 1
                  maximum: 1000000
