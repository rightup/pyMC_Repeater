          $ref: '#/components/schemas/LbtCorrelationValue'
        retry_rate_vs_avg_rssi:
          $ref: '#/components/schemas/LbtCorrelationValue'
        retry_rate_vs_packet_loss_rate:
          $ref: '#/components/schemas/LbtCorrelationValue'
        retry_rate_vs_traffic_volume:
