  # ============================================================================
  # Mobile Companion API v1 (repeater/web/mobile_endpoints.py)
  # ============================================================================
  /v1/server_info:
    get:
      tags: [Mobile Companion API v1]
      summary: Unauthenticated discovery
      description: |
        Unauthenticated-safe minimum an app uses to validate a scanned
        pairing URL before it has any credential: site name, supported API
        version(s), supported auth modes, repeater version/time.
        Deliberately excludes companion names (`GET /v1/companions` requires
        auth).
      responses:
        '200':
          description: Server info
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          site_name:
                            type: string
                          api_versions:
                            type: array
                            items:
                              type: string
                            example: ["v1"]
                          auth_modes:
                            type: array
                            items:
                              type: string
                            example: ["jwt", "api_token"]
                          server:
                            type: object
                            properties:
                              version:
                                type: string
                                nullable: true
                              time:
                                type: number
              examples:
                success:
                  value:
                    success: true
                    data:
                      site_name: "Everett North Repeater"
                      api_versions: ["v1"]
                      auth_modes: ["jwt", "api_token"]
                      server: { version: "1.4.0", time: 1789012345.6 }
        '405':
          description: |
            Method not allowed (only `GET`/`OPTIONS`). `Allow: GET` header
            set; rendered as the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'

  /v1/pair/start:
    post:
      tags: [Mobile Companion API v1]
      summary: Generate a pairing code (admin)
      description: |
        Admin-scope-only. Generates a single-use, 5-minute-TTL pairing code
        for a companion identity (design doc §11.2 step 1). Exempt from the
        tree-wide `/api` auth gate by config path (it shares the `/api/v1/
        pair` exemption via CherryPy config-path cascade), so this handler
        re-checks `admin` scope itself.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companion_name]
              properties:
                companion_name:
                  type: string
      responses:
        '200':
          description: Pairing code generated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          code:
                            type: string
                            description: 128-bit hex pairing code (5-minute TTL).
                          expires_in:
                            type: integer
                            example: 300
                          companion_name:
                            type: string
                          fingerprint:
                            type: string
                            description: sha256 hexdigest of the companion identity's public key (TOFU pin, §11.3).
        '400':
          description: |
            `companion_name required`. Rendered as the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '401':
          description: Missing/invalid JWT or API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '403':
          description: |
            `Admin scope required`. Rendered as the v1 JSON error envelope (see tag
            description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '404':
          description: |
            `Companion '{companion_name}' not found`. Rendered as the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'

  /v1/pair:
    post:
      tags: [Mobile Companion API v1]
      summary: Exchange a pairing code for a device token
      description: |
        No auth — the pairing code itself is the credential (design doc
        §11.2 steps 2-3). Exempt from the tree-wide `/api` auth gate. The
        code is consumed atomically (single use); unknown and expired codes
        both 404 with the same message so a caller can't distinguish "wrong
        code" from "code expired". Rate-limited to 10 attempts/60s globally
        across all callers, checked before code lookup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, device_id, name]
              properties:
                code:
                  type: string
                device_id:
                  type: string
                  description: Client-generated stable device identifier. Unique per companion_devices row.
                name:
                  type: string
                  description: Human-readable device name (e.g. "Adam's iPhone").
                platform:
                  type: string
                  nullable: true
                  example: ios
      responses:
        '200':
          description: Device paired; token returned once.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          token:
                            type: string
                            description: Plaintext device API token — shown once, store in Keychain. Send as `X-API-Key` on all subsequent v1 requests.
                          device_id:
                            type: string
                          companion_name:
                            type: string
                          scope:
                            type: string
                            example: "companion:field-radio-1"
        '400':
          description: |
            `code, device_id, and name are required`. Rendered as the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '404':
          description: |
            `Invalid or expired pairing code`. Rendered as the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '409':
          description: |
            `device_id already registered` — the just-minted token is
            revoked server-side before this response. Rendered as the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '429':
          description: |
            `Too many pairing attempts, try again later` (fixed 60s window,
            max 10 attempts, process-global). Rendered as the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '500':
          description: |
            `Authentication not configured` (no token manager wired up).
            Rendered as the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'

  /v1/devices:
    get:
      tags: [Mobile Companion API v1]
      summary: List paired devices (admin)
      description: |
        All companions' paired devices. `last_seen` is backfilled from the
        linked api_token's `last_used` timestamp when that is newer than the
        device row's own `last_seen` — presence is derived from token use,
        not written per-request.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Paired devices
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            companion_hash:
                              type: string
                              pattern: '^0x[0-9a-f]{2}$'
                            device_id:
                              type: string
                            name:
                              type: string
                            token_id:
                              type: integer
                            platform:
                              type: string
                              nullable: true
                            push_token:
                              type: string
                              nullable: true
                            push_relay_url:
                              type: string
                              nullable: true
                            push_detail:
                              type: string
                              enum: [none, count, preview]
                              description: Per-device push content level (design doc §12.2). Defaults to `none`.
                            mention_push:
                              type: boolean
                              description: Whether the content-free mention alert class is enabled for this device (design doc §12.2).
                            mention_keywords:
                              type: string
                              nullable: true
                              description: JSON array of trigger strings, or null to fall back to the companion node_name.
                            created_at:
                              type: number
                            last_seen:
                              type: number
                              nullable: true
                            last_synced_seq:
                              type: integer
                              nullable: true
        '403':
          description: |
            `Admin scope required`. Rendered as the v1 JSON error envelope (see tag
            description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'

  /v1/devices/{device_id}:
    delete:
      tags: [Mobile Companion API v1]
      summary: Revoke a paired device (admin)
      description: |
        Deletes the device's `api_tokens` row (its next request 401s
        naturally) and its `companion_devices` row.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Device revoked
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          revoked:
                            type: boolean
                            example: true
                          device_id:
                            type: string
        '403':
          description: |
            `Admin scope required`. Rendered as the v1 JSON error envelope (see tag
            description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '404':
          description: |
            `Device '{device_id}' not found`. Rendered as the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'

  /v1/devices/{device_id}/push:
    post:
      tags: [Mobile Companion API v1]
      summary: Register a device's push credentials
      description: |
        Register (or refresh) the APNs/FCM token, relay URL, and content
        level for a paired device (design doc §12.2). The repeater's notifier
        POSTs a wake to `push_relay_url` (as-is — the client registers the
        full notify endpoint) when the companion journals a new `message`,
        debounced per device (default 30s collapse window).

        **Payload-free by default.** `push_detail: none` sends only a wake;
        `count` adds a `badge_hint`; `preview` adds a short `alert` string —
        opting `preview` in is the only way message text reaches the relay,
        which is why it defaults off (§11.4).

        **Mentions.** `mention_push: true` enables a separate, content-free
        mention alert: when a new message's text matches one of the device's
        `mention_keywords` (or, if none set, the companion's node_name — as a
        whole word, case-insensitive), the relay push is a user-visible alert
        (`{mention: true, alert: "You were mentioned"}`, never the message
        text) instead of a silent wake. It takes precedence over `push_detail`
        for that push and is what makes a mention prompt without leaking
        content (design doc §12.2).

        The **relay service itself is a separate deliverable** (phase 4): until
        one is deployed, registration succeeds and the notifier's POSTs simply
        have no recipient; the app falls back to background-refresh sync.

        Auth: the device's **own** token (the token paired to `device_id`), or
        `admin`. A scoped device token registering for a *different* device
        gets `404` (same not-found-folding as the rest of /api/v1 — no
        cross-device existence leak). A token refresh may omit `push_relay_url`
        and `push_detail`; the stored values are kept.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [push_token]
              properties:
                push_token:
                  type: string
                  description: APNs/FCM device token.
                push_relay_url:
                  type: string
                  description: Absolute http(s) URL the notifier POSTs wakes to. Private/LAN targets allowed (self-hosted relays).
                push_detail:
                  type: string
                  enum: [none, count, preview]
                  description: Content level. Omitted → stored value (default `none`).
                mention_push:
                  type: boolean
                  description: Enable the content-free mention alert class. Omitted → stored value (default false).
                mention_keywords:
                  type: array
                  items:
                    type: string
                  description: Trigger strings for mentions. Omitted → stored value; `[]` → fall back to the companion node_name.
      responses:
        '200':
          description: Push registered
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          device_id:
                            type: string
                          push_detail:
                            type: string
                            enum: [none, count, preview]
                          mention_push:
                            type: boolean
                          registered:
                            type: boolean
                            example: true
        '400':
          description: |
            `push_token is required`, an invalid `push_detail`, a
            `push_relay_url` that isn't an absolute http(s) URL, a non-boolean
            `mention_push`, or a `mention_keywords` that isn't an array of
            strings. Rendered as the v1 JSON error envelope (see tag
            description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '401':
          description: Missing/invalid JWT or API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '404':
          description: |
            Device not found — also returned when a non-admin token that
            isn't this device's own attempts the call (no cross-device
            existence leak). Rendered as the v1 JSON error envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
    delete:
      tags: [Mobile Companion API v1]
      summary: Clear a device's push registration
      description: |
        Nulls the device's `push_token` (a complete push opt-out — the
        notifier skips any device without a token). `push_relay_url` and
        `push_detail` are left in place so a later re-register need only
        supply a fresh token. Same auth as the POST.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Push unregistered
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          unregistered:
                            type: boolean
                            example: true
                          device_id:
                            type: string
        '401':
          description: Missing/invalid JWT or API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '404':
          description: |
            Device not found (or not the caller's own device). Rendered as the
            v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'

  /v1/companions:
    get:
      tags: [Mobile Companion API v1]
      summary: List companion identities
      description: |
        Scope-filtered (design doc §11.1): a `companion:{name}` device token
        sees only its own companion (name + public key of the others are
        withheld, not just their action endpoints); `admin`/`companion:*`
        (and legacy scope-less callers) see all.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Companion identities visible to this caller's scope
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/MobileCompanionSummary'
        '401':
          description: Missing/invalid JWT or API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'

  /v1/companions/{name}/snapshot:
    get:
      tags: [Mobile Companion API v1]
      summary: Bootstrap document (state + journal cursor)
      description: |
        Full state snapshot plus the journal cursor it corresponds to
        (design doc §7.4): self info, contacts, channels (no PSK secrets),
        and the most recent messages. Journal head is read *before* the
        state queries, so any event with `seq >` the returned `cursor` may
        duplicate snapshot content — clients dedupe by message id.

        Supports conditional requests: `ETag` = `"{journal_epoch}:{head_seq}"`;
        send it back as `If-None-Match` to get `304 Not Modified` with no
        body when nothing has changed.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Companion identity name.
        - name: messages_limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 200
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
          description: Previously-received `ETag` value; a match returns `304`.
      responses:
        '200':
          description: Snapshot
          headers:
            ETag:
              schema:
                type: string
              description: '`"{journal_epoch}:{head_seq}"`'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MobileSnapshot'
        '304':
          description: Not modified — `If-None-Match` matched the current `ETag`. No body.
          headers:
            ETag:
              schema:
                type: string
        '401':
          description: Missing/invalid JWT or API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '404':
          description: |
            `Companion '{name}' not found` — returned both for unknown names
            and for companions outside the caller's token scope (identical
            status and message, so a scoped device token cannot enumerate
            other companion names). Rendered as the v1 JSON error envelope
            (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'

  /v1/companions/{name}/sync:
    get:
      tags: [Mobile Companion API v1]
      summary: Journal delta since a cursor
      description: |
        One indexed range scan (`idx_companion_events_sync`) bounded by
        `limit` (design doc §7.5). A `cursor` older than the journal's prune
        floor returns `200` with empty `events` and `"snapshot_required":
        true` rather than a silently incomplete delta — the client must
        re-fetch `snapshot` and resume from its `cursor`. `has_more: true`
        means immediately re-request with `next_cursor`.

        Supports `ETag`/`If-None-Match` the same way as `snapshot`
        (`"{journal_epoch}:{head_seq}"`) for cheap poll-and-check.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: cursor
          in: query
          required: true
          schema:
            type: string
            description: Opaque journal seq, as returned by `snapshot.cursor` or a prior `sync.next_cursor`. Non-negative integer string.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 500
        - name: include
          in: query
          required: false
          schema:
            type: string
          description: |
            Comma-separated opt-in list of otherwise-excluded event types.
            The only recognized token is `rf_receptions` — without it, the
            `rf_reception` firehose events (§9, off by default) are filtered
            out of `events` even for a companion that has the
            `rf_reception_events` setting enabled. Filtered rows still advance
            `next_cursor`/`has_more` (the scan, not the returned list, drives
            paging), so a client that opts in late never sees a gap. Unknown
            tokens are ignored.
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Delta (possibly empty)
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          journal_epoch:
                            type: string
                          events:
                            type: array
                            items:
                              $ref: '#/components/schemas/MobileJournalEvent'
                          next_cursor:
                            type: string
                          has_more:
                            type: boolean
                          snapshot_required:
                            type: boolean
              examples:
                delta:
                  value:
                    success: true
                    data:
                      journal_epoch: "b3f1c2"
                      events:
                        - { seq: 184224, type: message, ts: 1789012345.0, packet_hash: null, data: {} }
                      next_cursor: "184224"
                      has_more: false
                      snapshot_required: false
        '304':
          description: Not modified.
          headers:
            ETag:
              schema:
                type: string
        '400':
          description: |
            `cursor required` or `Invalid cursor`. Rendered as the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '401':
          description: Missing/invalid JWT or API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '404':
          description: |
            Companion not found — also returned for companions outside the
            caller's token scope (identical status and message, so a scoped
            device token cannot enumerate other companion names). Rendered as
            the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'

  /v1/companions/{name}/messages:
    get:
      tags: [Mobile Companion API v1]
      summary: Paged message history (infinite scroll)
      description: |
        Newest-first page over `companion_messages`, independent of the
        journal — serves history/infinite-scroll rather than sync.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: before_id
          in: query
          required: false
          schema:
            type: integer
          description: Exclusive upper bound on message `id` (rowid) — page backward in time.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Message page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          messages:
                            type: array
                            items:
                              $ref: '#/components/schemas/MobileMessage'
                          next_before_id:
                            type: integer
                            nullable: true
                            description: Pass as `before_id` to fetch the next (older) page; `null` when this page was empty.
        '400':
          description: |
            `Invalid before_id`. Rendered as the v1 JSON error envelope (see tag
            description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '401':
          description: Missing/invalid JWT or API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '404':
          description: |
            Companion not found — also returned for companions outside the
            caller's token scope (identical status and message, so a scoped
            device token cannot enumerate other companion names). Rendered as
            the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'

    post:
      tags: [Mobile Companion API v1]
      summary: Send a DM or channel message
      description: |
        Sends RF, so retries must be idempotent (design doc §6): the
        `Idempotency-Key` header is **required**. A retry with the same key
        and the same request body (companion name + JSON body, hashed)
        replays the stored response without touching the radio again; the
        same key against a different body, or a different companion, is a
        `409`. Only a *successful* send claims the key — a failed send
        leaves it unclaimed so a retry reaches the radio.

        Unlike the design doc's example response, the actual response has
        **no** `message_id`/`packet_hash` fields (code wins over doc): a DM
        send returns `{sent, is_flood, expected_ack}`; a channel send
        returns `{sent}`. Delivery/heard-repeat progress arrives only via
        `sync`/`events`, correlated by the client on `text`+timing, not by an
        id returned here.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
          description: Caller-generated opaque retry key, scoped per authenticated device (or `user:{username}` for JWT callers with no paired device row).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              description: Exactly one of `to` or `channel_idx` is required (validated as a strict XOR).
              properties:
                to:
                  type: string
                  description: Recipient's 32-byte public key, hex-encoded. Required for a DM; omit for a channel send.
                channel_idx:
                  type: integer
                  description: Channel index (0 is valid). Required for a channel send; omit for a DM.
                text:
                  type: string
                  minLength: 1
                txt_type:
                  type: integer
                  default: 0
                  description: DM only; ignored for channel sends.
      responses:
        '200':
          description: |
            Send attempted (`sent: false` is still a `200` — the radio/queue
            rejected it — not an error status), or a replayed response for a
            reused `Idempotency-Key` with an identical body.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - type: object
                            description: DM send result.
                            properties:
                              sent:
                                type: boolean
                              is_flood:
                                type: boolean
                              expected_ack:
                                type: boolean
                          - type: object
                            description: Channel send result.
                            properties:
                              sent:
                                type: boolean
              examples:
                dm_sent:
                  value:
                    success: true
                    data: { sent: true, is_flood: false, expected_ack: true }
                channel_sent:
                  value:
                    success: true
                    data: { sent: true }
        '400':
          description: |
            Missing `Idempotency-Key` header, invalid JSON body, neither/both
            of `to`/`channel_idx` set, missing `text`, or an invalid `to` hex
            key. Rendered as the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '401':
          description: Missing/invalid JWT or API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '404':
          description: |
            Companion not found — also returned for companions outside the
            caller's token scope (identical status and message, so a scoped
            device token cannot enumerate other companion names). Rendered as
            the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '409':
          description: |
            `Idempotency-Key reuse with different request` — same key,
            different companion or body. Rendered as the v1 JSON error envelope (see tag
            description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '504':
          description: |
            `Timed out waiting for radio response` — the bridge coroutine
            (default 30s) did not complete; the idempotency key is left
            unclaimed so a retry reaches the radio. Rendered as the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'

  /v1/companions/{name}/events:
    get:
      tags: [Mobile Companion API v1]
      summary: Resumable live event stream (SSE)
      description: |
        `text/event-stream`. Each frame: `id:` = `seq`, `event:` = event
        `type`, `data:` = the same JSON object `sync` returns for that row
        (design doc §8) — one schema, two transports.

        **Resume point:** the standard `Last-Event-ID` header if present,
        else `?cursor=`, else the current journal head (a bare connection
        gets a live tail only, no replay). On connect the server drains the
        backlog from that point (paged, reusing the sync query) before
        switching to a live tail; a cursor older than the prune floor gets
        one `event: snapshot_required` frame and the stream closes — the
        client must `snapshot` and reconnect with a fresh cursor.

        Keepalive: a `: ka` comment frame every `http.sse_keepalive_sec`
        (default 15s) while idle. A slow client whose queue overflows is
        disconnected outright (no unbounded buffering) — it reconnects with
        `Last-Event-ID` and replays what it missed.

        This endpoint does **not** carry the `@require_auth` decorator the
        other companion handlers do — auth still applies (the tree-wide
        CherryPy tool-level gate on `/api`, which also accepts `?token=` for
        `EventSource` and consumes it from the query string before the
        handler runs); stacking the decorator on top would re-check and
        401 a request whose token was already stripped.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Resume point if `Last-Event-ID` is absent. Defaults to current journal head.
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
          description: Standard SSE resume header; takes priority over `?cursor=`.
        - name: token
          in: query
          required: false
          schema:
            type: string
          description: JWT, for `EventSource` clients that cannot set an `Authorization` header. Consumed (stripped from params) before the handler runs.
        - name: include
          in: query
          required: false
          schema:
            type: string
          description: |
            Same semantics as on `sync`: a comma-separated opt-in list whose
            only recognized token is `rf_receptions`. Applies to both the
            backlog replay and the live tail — without it, `rf_reception`
            firehose frames are suppressed. Unknown tokens are ignored.
      responses:
        '200':
          description: Event stream established
          headers:
            Content-Type:
              schema:
                type: string
                example: text/event-stream
            Cache-Control:
              schema:
                type: string
                example: no-cache
            X-Accel-Buffering:
              schema:
                type: string
                example: "no"
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Stream of `id: {seq}\nevent: {type}\ndata: {json}\n\n` frames,
                  `: ka\n\n` keepalive comments, and — only when `cursor`/
                  `Last-Event-ID` is below the prune floor — a single
                  `event: snapshot_required\ndata: {"journal_epoch":…,
                  "snapshot_required":true}\n\n` frame before the stream ends.
        '400':
          description: |
            `Invalid cursor`. Rendered as the v1 JSON error envelope (see tag
            description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '401':
          description: Missing/invalid JWT or API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '404':
          description: |
            Companion not found — also returned for companions outside the
            caller's token scope (identical status and message, so a scoped
            device token cannot enumerate other companion names). Rendered as
            the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '503':
          description: |
            `Companion event journal not available`. Rendered as the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'

  /v1/companions/{name}/contacts/{pubkey}:
    post:
      tags: [Mobile Companion API v1]
      summary: Add or update a contact
      description: |
        Upsert the contact identified by `{pubkey}`. The body carries only
        mutable fields; omitted ones keep their current value on an update and
        take model defaults on an insert. Learned routing state (`out_path`,
        advert timestamps) is preserved across an update — a client renaming a
        contact must not erase what the mesh taught the node.

        Adverts already auto-add contacts (gated by `autoadd_config` and
        `autoadd_max_hops`, neither settable on this surface), so this is
        mainly for contacts auto-add filtered out: wrong type, or too many hops
        away.

        Emits a `contact` journal event (`change: new` or `update`).
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: pubkey
          in: path
          required: true
          schema:
            type: string
          description: Contact public key, hex.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                adv_type:
                  type: integer
                flags:
                  type: integer
                  description: |
                    Raw contact flag bitfield. **Bit 0 (`0x01`) marks a
                    favourite**, which protects the contact from forced-trim
                    eviction when the store fills. Other bits are in active use
                    on real deployments (values like `129` and `145` occur), so
                    prefer the `favorite` boolean below over writing this
                    directly — the server does a read-modify-write that
                    preserves the bits you did not mean to touch.
                favorite:
                  type: boolean
                  description: |
                    Convenience over `flags` bit 0. Derived on read, and on
                    write sets/clears just that bit. If both `flags` and
                    `favorite` are supplied, `favorite` wins.
                out_path_len:
                  type: integer
                gps_lat:
                  type: number
                gps_lon:
                  type: number
      responses:
        '200':
          description: Contact upserted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          contact:
                            type: object
        '401':
          description: Missing/invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '404':
          description: Companion not found or out of scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '507':
          description: |
            Contact store is full — the equivalent of the frame protocol's
            `PUSH_CODE_CONTACTS_FULL`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
    delete:
      tags: [Mobile Companion API v1]
      summary: Remove a contact
      description: |
        Delete the contact and its stored row. Emits a `contact` journal event
        with `change: removed`, so other synced devices drop it too.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: pubkey
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Removed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          removed:
                            type: boolean
        '404':
          description: Contact (or companion) not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'

  /v1/companions/{name}/channels/{index}:
    put:
      tags: [Mobile Companion API v1]
      summary: Join or rename a channel
      description: |
        Set channel slot `{index}` to `{name, secret}`.

        **`secret` is write-only.** It is accepted here but never returned by
        any v1 endpoint — `snapshot.channels` exposes `{index, name}` only, and
        the `channel` journal event carries no secret either (§11.4). Clients
        learn the PSK out of band (QR code, invite link), exactly as MeshCore
        clients do.

        This is what makes channel *joining* possible over REST at all: before
        it, a client could only use channels already configured on the
        repeater, because the surface withheld secrets and had no way to accept
        one.

        Emits a `channel` journal event (`change: update`). Use `DELETE` to
        clear a slot — an empty `name` here is a `400`.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: index
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, secret]
              properties:
                name:
                  type: string
                secret:
                  type: string
                  description: |
                    Channel PSK as hex — 32 or 64 characters (16 or 32 bytes).
                    Write-only; never returned.
      responses:
        '200':
          description: |
            Channel set. The response echoes `{index, name}` only — never the
            secret.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          channel:
                            type: object
                            properties:
                              index:
                                type: integer
                              name:
                                type: string
        '400':
          description: |
            Missing `name`, non-hex `secret`, wrong secret length, or a
            non-integer index.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '404':
          description: Channel index out of range, or companion not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
    delete:
      tags: [Mobile Companion API v1]
      summary: Clear a channel slot
      description: |
        Clear the slot. Emits a `channel` journal event with
        `change: remove` and `name: null`.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: index
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Cleared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Channel not configured, or companion not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'

  /v1/companions/{name}/contacts/{pubkey}/login:
    post:
      tags: [Mobile Companion API v1]
      summary: Room/repeater login for a contact
      description: |
        Mirrors the legacy `/api/companion/login` bridge call. No
        idempotency requirement (only message sends transmit a duplicable
        payload, design doc §6). 15s bridge timeout.

        **Synchronous by design.** This blocks on the mesh round trip and
        returns the result inline, rather than acknowledging and reporting the
        outcome later via the journal. A multi-hop round trip can exceed the
        timeout, and when it does the caller gets a timeout error and the
        response is **dropped** — the frame protocol would still deliver its
        `PUSH_CODE_*_RESPONSE` whenever it arrived. The design doc §9 lists
        `login_result` / `status_response` / `telemetry_response` journal
        events that would fix this; they are **not implemented**. Clients
        should treat a timeout as "unknown", not "failed".

      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: pubkey
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{64}$'
          description: Contact's 32-byte public key, hex-encoded.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  default: ""
      responses:
        '200':
          description: Login attempted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MobileActionResult'
        '400':
          description: |
            Invalid JSON body or invalid public key. Rendered as the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '401':
          description: Missing/invalid JWT or API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '404':
          description: |
            Companion not found — also returned for companions outside the
            caller's token scope (identical status and message, so a scoped
            device token cannot enumerate other companion names). Rendered as
            the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '405':
          description: |
            Method not allowed (POST only, no OPTIONS exception). Rendered as the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '504':
          description: |
            Bridge coroutine timed out. Rendered as the v1 JSON error envelope (see tag
            description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'

  /v1/companions/{name}/contacts/{pubkey}/status_request:
    post:
      tags: [Mobile Companion API v1]
      summary: Request a contact's status
      description: |
        Mirrors the legacy `/api/companion/request_status` bridge call.
        Empty body. Bridge timeout 15s (handler waits up to 20s total).

        Synchronous like `/login`: it blocks on the mesh round trip and
        returns inline, so a timeout means "unknown", not "failed". See the
        `/login` description and design doc §9 for the unimplemented
        journal-event alternative.

      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: pubkey
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{64}$'
      responses:
        '200':
          description: Status request completed (or timed out inside the bridge call and returned a failure result)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MobileActionResult'
        '400':
          description: |
            Invalid public key. Rendered as the v1 JSON error envelope (see tag
            description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '401':
          description: Missing/invalid JWT or API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '404':
          description: |
            Companion not found — also returned for companions outside the
            caller's token scope (identical status and message, so a scoped
            device token cannot enumerate other companion names). Rendered as
            the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '504':
          description: |
            Bridge coroutine timed out (outer 20s guard). Rendered as the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'

  /v1/companions/{name}/contacts/{pubkey}/telemetry_request:
    post:
      tags: [Mobile Companion API v1]
      summary: Request a contact's telemetry
      description: |
        Mirrors the legacy `/api/companion/request_telemetry` bridge call,
        always requesting base + location + environment. Empty body. Bridge
        timeout 20s (handler waits up to 25s total).

        Synchronous like `/login`: it blocks on the mesh round trip and
        returns inline, so a timeout means "unknown", not "failed". See the
        `/login` description and design doc §9 for the unimplemented
        journal-event alternative.

      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: pubkey
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{64}$'
      responses:
        '200':
          description: Telemetry request completed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MobileActionResult'
        '400':
          description: |
            Invalid public key. Rendered as the v1 JSON error envelope (see tag
            description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '401':
          description: Missing/invalid JWT or API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '404':
          description: |
            Companion not found — also returned for companions outside the
            caller's token scope (identical status and message, so a scoped
            device token cannot enumerate other companion names). Rendered as
            the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '504':
          description: |
            Bridge coroutine timed out (outer 25s guard). Rendered as the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'

  /v1/companions/{name}/contacts/{pubkey}/reset_path:
    post:
      tags: [Mobile Companion API v1]
      summary: Reset a contact's outbound routing path
      description: |
        Mirrors the legacy `/api/companion/reset_path` bridge call. Empty
        body, synchronous (not routed through `_run_async` — no bridge
        timeout applies).
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: pubkey
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{64}$'
      responses:
        '200':
          description: Path reset
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          reset:
                            type: boolean
        '400':
          description: |
            Invalid public key. Rendered as the v1 JSON error envelope (see tag
            description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '401':
          description: Missing/invalid JWT or API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '404':
          description: |
            Companion not found — also returned for companions outside the
            caller's token scope (identical status and message, so a scoped
            device token cannot enumerate other companion names). Rendered as
            the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'

  /v1/companions/{name}/messages/{id}/receptions:
    get:
      tags: [Mobile Companion API v1]
      summary: Every RF reception of a message's packet_hash
      description: |
        RF observation surface (design doc §10). Returns every reception of
        the message's `packet_hash` within the window — per-copy RSSI/SNR,
        the incoming path (each element resolved against the companion's
        contacts, §10.5), arrival time, and whether we retransmitted it.
        Answers "how did this message reach me, and how well".

        The window is measured back from *now*, not anchored on the message's
        own timestamp — a message can be heard again well after it first
        arrived — so a copy that predates the message but falls inside the
        window is included. The query resolves through `idx_packets_hash`
        with the bounded window (§10.1); `observation_count`/
        `unique_path_count` are the exact counts from this query, not the
        approximate running counters on the message row (§10.4). A message
        with no `packet_hash` (predates correlation) returns an empty
        `receptions` list rather than a 404.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: The `companion_messages` row id.
        - name: window
          in: query
          required: false
          schema:
            type: string
            default: 24h
          description: |
            Look-back window, back from now. Bare integer seconds or an
            integer with an `s`/`m`/`h`/`d` suffix (e.g. `30m`, `24h`, `7d`).
            Clamped to `[60s, 7d]` (default `24h`); a malformed string is a
            `400` (§10.1).
      responses:
        '200':
          description: Receptions (possibly empty)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message_id:
                            type: integer
                          packet_hash:
                            type: string
                            nullable: true
                            description: 16-char (64-bit) correlation key, or null if the message has none.
                          window:
                            type: integer
                            description: Effective (clamped) window in seconds.
                          receptions:
                            type: array
                            items:
                              $ref: '#/components/schemas/RfReception'
                          observation_count:
                            type: integer
                          unique_path_count:
                            type: integer
                          observations_pruned:
                            type: boolean
                            description: True when the window reaches past the packets retention floor (§10.6).
        '400':
          description: |
            `Invalid message id` or `Invalid window`. Rendered as the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '401':
          description: Missing/invalid JWT or API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '404':
          description: |
            Companion or message not found — also returned for companions
            outside the caller's token scope (identical status and message).
            Rendered as the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'

  /v1/companions/{name}/contacts/{pubkey}/paths:
    get:
      tags: [Mobile Companion API v1]
      summary: Incoming path aggregation for a contact
      description: |
        RF observation surface (design doc §10). Aggregates distinct incoming
        paths seen on a contact's traffic within the window, each with a copy
        count, first/last-seen timestamps, and RSSI/SNR min/max/avg — a
        "route diversity" view. Paths are ordered most-observed first.

        Resolution is by `companion_messages.sender_key`, so the contact does
        not need to exist in `companion_contacts` to be queried. The contact's
        recent `packet_hash`es are resolved first (bounded to
        `message_limit` messages, reported as `messages_scanned`), then a
        hash-keyed `idx_packets_hash` lookup per packet — never a scan of
        `packets` on a non-indexed column (§10.1). Each path element is
        resolved against the companion's contacts (§10.5).
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: pubkey
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{64}$'
        - name: window
          in: query
          required: false
          schema:
            type: string
            default: 24h
          description: |
            Look-back window, back from now. Same format/clamps as the
            receptions endpoint (`[60s, 7d]`, default `24h`, §10.1).
      responses:
        '200':
          description: Path aggregation (possibly empty)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          contact_pubkey:
                            type: string
                            description: Lowercase hex, echoed from the path param.
                          window:
                            type: integer
                          paths:
                            type: array
                            items:
                              $ref: '#/components/schemas/RfPathAggregate'
                          total_observations:
                            type: integer
                          messages_scanned:
                            type: integer
                            description: Number of the contact's messages resolved for hashes (bounded).
                          message_limit:
                            type: integer
                            description: The cap on `messages_scanned` (200).
                          observations_pruned:
                            type: boolean
        '400':
          description: |
            Invalid public key or `Invalid window`. Rendered as the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '401':
          description: Missing/invalid JWT or API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '404':
          description: |
            Companion not found — also returned for companions outside the
            caller's token scope (identical status and message). Rendered as
            the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'

  /v1/companions/{name}/transmissions/{packet_hash}/repeats:
    get:
      tags: [Mobile Companion API v1]
      summary: Heard repeats of our own transmission
      description: |
        RF observation surface (design doc §10). Given a `packet_hash` we
        transmitted, returns the receptions of that same hash arriving
        *after* our transmit — neighbors repeating us. The strongest
        available signal that a send actually propagated.

        Predicate is exactly §10.3: `is_duplicate=1 AND transmitted=0 AND
        timestamp > tx.timestamp` (local echo and the transmit row itself are
        excluded). Two counts are exposed and neither is collapsed into the
        other: `heard_repeat_count` (every matching OTA copy — a repeater
        heard twice counts twice) and `unique_repeater_count` (distinct
        terminal path hashes, i.e. the last hop each copy took). Both are a
        lower bound (hash-changing rebroadcast variants are out of scope,
        §10.3). `packet_hash` accepts either the full or already-truncated
        16-char form.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: packet_hash
          in: path
          required: true
          schema:
            type: string
          description: The transmission's correlation key (full or 16-char hex).
        - name: window
          in: query
          required: false
          schema:
            type: string
            default: 24h
          description: |
            Look-back window for locating the transmit row, back from now.
            Same format/clamps as the receptions endpoint (`[60s, 7d]`,
            default `24h`, §10.1). Repeats are then searched from the
            transmit time forward.
      responses:
        '200':
          description: Heard repeats (possibly empty)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          packet_hash:
                            type: string
                            description: 16-char correlation key.
                          transmitted_at:
                            type: number
                            description: Earliest matching transmit timestamp (epoch seconds).
                          window:
                            type: integer
                          repeats:
                            type: array
                            items:
                              $ref: '#/components/schemas/RfHeardRepeat'
                          heard_repeat_count:
                            type: integer
                          unique_repeater_count:
                            type: integer
                          observations_pruned:
                            type: boolean
        '400':
          description: |
            `Invalid packet_hash` or `Invalid window`. Rendered as the v1 JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '401':
          description: Missing/invalid JWT or API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'
        '404':
          description: |
            Companion not found, or no transmission of this `packet_hash` in
            the window — also returned for companions outside the caller's
            token scope (identical status and message). Rendered as the v1
            JSON error envelope (see tag description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV1'

components:
  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          description: Response data (varies by endpoint)

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: Error message

    ErrorResponseV1:
      description: |
        Error envelope for the Mobile Companion API v1 tree (`/api/v1/*`).
        Every non-2xx response under `/v1/*` — auth failures (401), scope
        rejections (403), not-found (404), validation errors (400/422), and
        uncaught exceptions (500) alike — renders this same JSON shape
        instead of CherryPy's default HTML error page
        (`repeater/web/http_server.py`'s `error_page.401` handler and the
        `/api/v1` `error_page.default` handler registered alongside it).
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            status:
              type: integer
              description: HTTP status code, echoed in the body for convenience.
              example: 401

