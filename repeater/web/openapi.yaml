      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: key_id
          in: query
          required: true
          schema:
            type: string
          description: Key ID to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Updated key name
                flood_policy:
                  type: string
                  enum: [allow, deny]
