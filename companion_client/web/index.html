<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenHop Companion — Chat Client</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1e222b; --line: #2a2f3a;
    --text: #e6e9ef; --muted: #8b93a7; --accent: #4f9cf9; --accent-2: #2b6fc2;
    --in: #232834; --out: #2b5f9e; --push: #1d2b22; --push-line: #2e6b45;
    --mention: #3a2a1a; --mention-line: #a8712c;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f7fa; --panel: #ffffff; --panel-2: #f0f3f7; --line: #dfe4ec;
      --text: #16191f; --muted: #5f6878; --accent: #1a73e8; --accent-2: #1557b0;
      --in: #eef1f6; --out: #d6e6ff; --push: #e8f5ec; --push-line: #7bc496;
      --mention: #fdf1de; --mention-line: #d99a3e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 12px 18px; background: var(--panel); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .badge {
    font-size: 12px; padding: 2px 8px; border-radius: 999px;
    background: var(--panel-2); color: var(--muted); border: 1px solid var(--line);
  }
  .badge.mode-sim { color: #7bc496; border-color: var(--push-line); }
  .badge.mode-live { color: var(--accent); border-color: var(--accent-2); }
  main { flex: 1; display: flex; min-height: 0; }
  .col { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .chat { flex: 3; border-right: 1px solid var(--line); }
  .side { flex: 2; background: var(--panel); min-width: 300px; }
  .col > h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: 0; padding: 12px 18px 8px;
  }
  .scroll { flex: 1; overflow-y: auto; padding: 8px 18px 18px; }
  .msg { margin: 8px 0; display: flex; }
  .msg.out { justify-content: flex-end; }
  .bubble {
    max-width: 74%; padding: 8px 12px; border-radius: 14px;
    background: var(--in); white-space: pre-wrap; word-break: break-word;
  }
  .msg.out .bubble { background: var(--out); }
  .meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .push {
    border: 1px solid var(--push-line); background: var(--push);
    border-radius: 10px; padding: 10px 12px; margin: 8px 0; font-size: 13px;
  }
  .push.mention { border-color: var(--mention-line); background: var(--mention); }
  .push .shape {
    font-weight: 600; text-transform: uppercase; font-size: 11px;
    letter-spacing: .06em; margin-bottom: 4px;
  }
  .push pre {
    margin: 6px 0 0; font-size: 11px; color: var(--muted);
    white-space: pre-wrap; word-break: break-all; font-family: ui-monospace, monospace;
  }
  footer { border-top: 1px solid var(--line); padding: 12px 18px; background: var(--panel); }
  .row { display: flex; gap: 8px; }
  input[type=text] {
    flex: 1; padding: 10px 12px; border-radius: 10px; background: var(--panel-2);
    border: 1px solid var(--line); color: var(--text); font-size: 15px; min-width: 0;
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    padding: 10px 16px; border-radius: 10px; border: 1px solid var(--accent-2);
    background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--muted); border-color: var(--line); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .empty { color: var(--muted); font-size: 13px; padding: 12px 0; }
  #err { color: #e5534b; font-size: 13px; padding: 0 18px 8px; display: none; }
  @media (max-width: 820px) {
    main { flex-direction: column; }
    .chat { border-right: none; border-bottom: 1px solid var(--line); }
    .side { min-width: 0; }
  }
</style>
</head>
<body>
<header>
  <h1>OpenHop Companion</h1>
  <span class="badge" id="mode">connecting…</span>
  <span class="badge" id="node"></span>
</header>
<div id="err"></div>
<main>
  <section class="col chat">
    <h2>Channel 0</h2>
    <div class="scroll" id="messages"><div class="empty">No messages yet.</div></div>
    <footer>
      <div class="row">
        <input type="text" id="text" placeholder="Message the mesh…" autocomplete="off">
        <button id="send">Send</button>
      </div>
      <div class="row" style="margin-top:8px">
        <input type="text" id="inject" placeholder="Simulate an inbound message…" autocomplete="off">
        <button class="ghost" id="injectBtn">Receive</button>
      </div>
      <div class="hint">
        Sent messages go out to the mesh. <strong>Receive</strong> simulates traffic
        arriving — that is what triggers a push. Try including “adam” to fire a mention.
      </div>
    </footer>
  </section>
  <aside class="col side">
    <h2>Push notifications</h2>
    <div class="scroll" id="pushes"><div class="empty">Pushes captured from the notifier appear here.</div></div>
  </aside>
</main>

<script>
const $ = (id) => document.getElementById(id);
const messagesEl = $("messages"), pushesEl = $("pushes"), errEl = $("err");

function clearEmpty(el) {
  const empty = el.querySelector(".empty");
  if (empty) empty.remove();
}
function atBottom(el) { return el.scrollHeight - el.scrollTop - el.clientHeight < 40; }

function addMessage(m) {
  clearEmpty(messagesEl);
  const stick = atBottom(messagesEl);
  const wrap = document.createElement("div");
  wrap.className = "msg " + (m.direction === "out" ? "out" : "in");
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = m.text;
  const meta = document.createElement("div");
  meta.className = "meta";
  const when = m.timestamp ? new Date(m.timestamp * 1000).toLocaleTimeString() : "";
  meta.textContent = (m.direction === "out" ? "sent" : "received") +
    (when ? " · " + when : "") +
    (m.snr != null ? " · SNR " + m.snr : "");
  bubble.appendChild(meta);
  wrap.appendChild(bubble);
  messagesEl.appendChild(wrap);
  if (stick) messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addPush(p) {
  clearEmpty(pushesEl);
  const stick = atBottom(pushesEl);
  const box = document.createElement("div");
  box.className = "push" + (p.shape === "mention" ? " mention" : "");
  const shape = document.createElement("div");
  shape.className = "shape";
  shape.textContent = p.shape;
  const desc = document.createElement("div");
  desc.textContent = {
    wake: "Silent wake — no content left the repeater.",
    count: "Silent push carrying a badge count.",
    preview: "Visible alert carrying message text.",
    mention: "Content-free time-sensitive alert.",
  }[p.shape] || "";
  const pre = document.createElement("pre");
  pre.textContent = JSON.stringify(p.body, null, 2);
  box.append(shape, desc, pre);
  pushesEl.appendChild(box);
  if (stick) pushesEl.scrollTop = pushesEl.scrollHeight;
}

function showError(msg) {
  errEl.textContent = msg;
  errEl.style.display = msg ? "block" : "none";
}

async function post(url, body) {
  const res = await fetch(url, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).error || detail; } catch (e) {}
    throw new Error(detail);
  }
  return res.json();
}

async function init() {
  const state = await (await fetch("/api/state")).json();
  const mode = $("mode");
  mode.textContent = state.mode === "sim" ? "simulator" : "live";
  mode.className = "badge mode-" + state.mode;
  $("node").textContent = state.node_name ? state.node_name + " · 0x" + state.companion_hash : "";
  (state.messages || []).forEach(addMessage);
  if (!state.can_inject) {
    $("inject").disabled = true;
    $("injectBtn").disabled = true;
    $("inject").placeholder = "Simulated receive is only available in simulator mode";
  }

  const stream = new EventSource("/api/events");
  stream.onmessage = (e) => {
    const evt = JSON.parse(e.data);
    if (evt.kind === "message") addMessage(evt.data);
    else if (evt.kind === "push") addPush(evt.data);
  };
  stream.onerror = () => showError("Event stream disconnected — is the server still running?");
}

async function doSend() {
  const input = $("text"), text = input.value.trim();
  if (!text) return;
  input.value = "";
  showError("");
  try { await post("/api/send", {text}); }
  catch (err) { showError("Send failed: " + err.message); }
}

async function doInject() {
  const input = $("inject"), text = input.value.trim();
  if (!text) return;
  input.value = "";
  showError("");
  try { await post("/api/inject", {text}); }
  catch (err) { showError("Receive failed: " + err.message); }
}

$("send").onclick = doSend;
$("injectBtn").onclick = doInject;
$("text").onkeydown = (e) => { if (e.key === "Enter") doSend(); };
$("inject").onkeydown = (e) => { if (e.key === "Enter") doInject(); };
init().catch((e) => showError("Failed to load: " + e.message));
</script>
</body>
</html>
